# LES DEUX URLS, PUBLIÉES À CHAQUE POUSSÉE SUR `main`.
#
# La règle du dépôt (CLAUDE.md §2) : toute livraison d'un écran comporte DEUX
# adresses — le jeu, et le même à la taille d'un téléphone. Avec une seule, on
# ouvre la page en 1 400 px de large : tout y tient, donc tout va bien, donc on
# ne voit rien, et c'est ainsi qu'un écran amputé traverse une relecture.
#
# RIEN N'EST COMMITÉ DANS `dist/` : le workflow refond les deux fichiers depuis
# les sources à chaque fois. Un fichier construit à la main et poussé finit
# toujours par dater d'une version que plus personne ne peut retrouver.
#
# LA SUITE TOURNE AVANT LE DÉPLOIEMENT, et le fait échouer. Publier un jeu dont
# les règles sont cassées coûte plus cher que ne pas publier.
name: Publier les deux URLs

on:
  push:
    branches: [main]
  workflow_dispatch:      # pour publier à la demande, sans attendre une poussée

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, et le plus récent gagne.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Le jeu n'a aucune dépendance : rien à installer.
      - name: La suite du jeu
        run: node test/run.js

      - name: Fondre les deux fichiers
        run: node tools/bundle-mockup.mjs docs/mockups/jeu.html dist/jeu.html

      # LE JEU EST À LA RACINE : le site EST le jeu, il n'y a rien à expliquer à
      # qui ouvre l'adresse. L'aperçu est un OUTIL, il vit dans son dossier.
      - name: Ranger le site
        run: |
          mkdir -p _site/apercu-telephone
          cp dist/jeu.html                   _site/index.html
          cp dist/jeu-apercu-telephone.html  _site/apercu-telephone/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
