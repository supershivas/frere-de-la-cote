<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>B2 — combat à deux jauges (maquette jouable)</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea-top:#1b3550; --sea:#12283c; --sky:#2b4a63;
  --parch:#e6dcc3; --gold:#c9a24b; --red:#c0392b; --green:#6fae92; --amber:#e08a5a;
  --disp:"IM Fell English",Georgia,serif; --sc:"IM Fell English SC",Georgia,serif; --mono:"Courier Prime",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:linear-gradient(var(--sky) 0%, var(--sea-top) 38%, var(--sea) 100%);
  min-height:100vh;color:var(--parch);font-family:var(--disp);
  padding:10px clamp(8px,2vw,22px) 18px;
}
.note{max-width:1180px;margin:0 auto 10px;font-size:12.5px;font-style:italic;opacity:.72;text-align:center}
.wrap{max-width:1180px;margin:0 auto}

/* ---- bande de distance ---- */
.range{display:flex;gap:12px;justify-content:center;align-items:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(236,228,206,.72);padding:4px 0 10px}
.range b{color:var(--parch);font-weight:400;border-bottom:1px solid var(--gold);padding-bottom:2px}
.range .turn{margin-left:auto;color:rgba(236,228,206,.9)}

/* ---- les deux navires ---- */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,3vw,40px);align-items:end;
  padding-bottom:8px;position:relative}
.duel::after{content:'';position:absolute;left:0;right:0;bottom:64px;height:2px;
  background:linear-gradient(90deg,transparent,rgba(150,200,215,.45) 10%,rgba(150,200,215,.45) 90%,transparent)}
.ship{display:flex;flex-direction:column;align-items:center}
.ship canvas{image-rendering:pixelated;display:block}
.ship .nm{font-family:var(--sc);font-size:17px;padding-top:6px}
.ship .sub{font-family:var(--mono);font-size:9.5px;opacity:.72;letter-spacing:.06em}

/* ---- LES DEUX JAUGES : le coeur de B2 ---- */
.gauges{width:100%;max-width:340px;margin-top:8px;display:flex;flex-direction:column;gap:5px}
.g{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px}
.g .lb{width:78px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;text-align:right}
.g .track{flex:1;height:15px;background:rgba(8,16,24,.66);border:1px solid rgba(201,162,75,.42);position:relative}
.g .fill{position:absolute;inset:0 auto 0 0;transition:width .32s ease}
.g.coque .fill{background:linear-gradient(90deg,#8a3a2a,#c0392b)}
.g.crew  .fill{background:linear-gradient(90deg,#4a7f66,#6fae92)}
.g .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000}
.g.aim .track{outline:2px solid var(--gold);outline-offset:1px;cursor:pointer}
.g.aimable .track{cursor:pointer}
.g.aimable:hover .track{border-color:var(--gold)}

/* ---- répartition d'équipage : le choix de chaque tour ---- */
.posts{border:1px solid rgba(201,162,75,.4);background:rgba(12,22,32,.62);padding:9px 12px;margin-top:10px}
.posts h4{font-family:var(--sc);font-size:15px;font-weight:400;display:flex;align-items:baseline;gap:10px}
.posts h4 small{font-family:var(--mono);font-size:10px;opacity:.7;letter-spacing:.05em}
.postrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:7px}
.post{border:1px solid rgba(201,162,75,.28);background:rgba(8,16,24,.5);padding:6px 9px}
.post .t{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.post .v{font-family:var(--sc);font-size:24px;line-height:1.1}
.post .fx{font-size:11.5px;font-style:italic;opacity:.8;min-height:30px}
.post .btns{display:flex;gap:5px;padding-top:4px}
.post button{flex:1;background:rgba(201,162,75,.14);border:1px solid rgba(201,162,75,.5);
  color:var(--parch);font-family:var(--mono);font-size:13px;cursor:pointer;padding:1px 0}
.post button:hover:not(:disabled){background:rgba(201,162,75,.32)}
.post button:disabled{opacity:.3;cursor:not-allowed}

/* ---- intention ---- */
.intent{font-family:var(--mono);font-size:11px;background:rgba(12,20,28,.72);
  border-left:3px solid var(--red);padding:5px 10px;margin-top:9px}
.intent b{color:#f0b48a;font-weight:400}

/* ---- munitions + actions ---- */
.ammo{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding-top:9px}
.ammo button{display:flex;align-items:center;gap:5px;background:rgba(20,15,11,.75);
  border:1px solid rgba(201,162,75,.35);color:var(--parch);font-family:var(--mono);
  font-size:11px;padding:3px 9px;cursor:pointer}
.ammo button.on{border-color:var(--gold);background:rgba(201,162,75,.2)}
.ammo button:disabled{opacity:.78;border-style:dashed;cursor:not-allowed;text-decoration:line-through}
.hint{text-align:center;font-size:12.5px;font-style:italic;opacity:.86;padding:5px 0;min-height:20px}
.acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.acts button{display:flex;flex-direction:column;align-items:center;background:rgba(20,15,11,.82);
  border:1px solid rgba(201,162,75,.45);color:var(--parch);font-family:var(--mono);font-size:12px;
  padding:4px 14px;cursor:pointer;line-height:1.3}
.acts button.cta{border-color:var(--gold);background:rgba(201,162,75,.2)}
.acts button:disabled{opacity:1;cursor:not-allowed;border-color:rgba(201,162,75,.2);background:rgba(16,12,9,.8)}
.acts .why{font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;color:#e8b98a}
.log{font-family:var(--mono);font-size:11px;line-height:1.7;opacity:.85;text-align:center;
  min-height:36px;padding-top:7px}
.rules{text-align:center;font-size:11px;font-style:italic;opacity:.6;padding-top:6px}

.over{position:fixed;inset:0;margin:auto;width:min(430px,90vw);height:fit-content;
  background:rgba(20,15,11,.97);border:2px solid var(--gold);padding:20px 24px;text-align:center;z-index:9}
.over h2{font-family:var(--sc);font-size:27px;font-weight:400}
.over p{font-family:var(--mono);font-size:12px;padding-top:8px}
.over button{margin-top:14px;background:rgba(201,162,75,.2);border:1px solid var(--gold);
  color:var(--parch);font-family:var(--mono);font-size:13px;padding:5px 16px;cursor:pointer}
@media(max-width:820px){.duel{grid-template-columns:1fr}.duel::after{display:none}}
</style>
</head>
<body>

<p class="note">Maquette jetable — proposition <b>B2</b> : deux jauges, répartition d'équipage, pas de salles.
Jouez quelques combats et regardez si le tour contient une vraie décision.</p>

<div class="wrap">
  <p class="range" id="range"></p>
  <div class="duel">
    <div class="ship" id="mine"></div>
    <div class="ship" id="theirs"></div>
  </div>

  <div class="posts" id="posts"></div>
  <p class="intent" id="intent"></p>
  <div class="ammo" id="ammo"></div>
  <p class="hint" id="hint"></p>
  <div class="acts" id="acts"></div>
  <p class="log" id="log"></p>
  <p class="rules">Chaque tour : répartissez vos hommes (gratuit), puis UNE manœuvre et UNE bordée. Les deux sont facultatives.</p>
</div>

<script type="module">
import { getGeneratedShip, drawShip } from '../../../src/sprites.js';

/* ============================================================
   B2 — DEUX JAUGES.
   Coque = la couler (rapide, sûr, ne rapporte presque rien).
   Équipage = la prendre (lent, coûteux, rapporte tout).
   Aucune salle, aucun trajet. Le choix de chaque tour est la
   RÉPARTITION des hommes entre trois postes.
   ============================================================ */

const RANGES = ['Bord à bord','Portée de mousquet','Portée de canon','Au loin'];
const BOARD=0, MUSKET=1, CANNON=2, FAR=3;

const AMMO = {
  boulet:      { ico:'●', nom:'Boulet',    max:CANNON, hint:'Ronge la coque. La voie rapide, et la moins payante.' },
  chaine:      { ico:'⛓', nom:'Chaîne',    max:CANNON, hint:'Abat le gréement : elle ne peut plus rompre le combat. Ne touche pas la coque.' },
  mitraille:   { ico:'✳', nom:'Mitraille', max:MUSKET, hint:'Fauche son équipage. C\'est ce qui rend un abordage gagnable.' },
  explosif:    { ico:'💥', nom:'Explosif',  max:CANNON, hint:'Coque et équipage à la fois, mais moins fort sur les deux.' },
};

const LIVERY = {
  nous: { hull:'#5a3d25', sail:'#e6d9bd', faction:'#8a1f1f',
          flag:{motif:'Crâne',bg:'#161616',sym:'#e6d9bd',accent:'#f1c40f'}, trim:'aucun' },
  eux:  { hull:'#6b4a2b', sail:'#efe6cf', faction:'#b5121b',
          flag:{motif:'Bandes',bg:'#b5121b',sym:'#f1c40f',accent:'#f4f4f4'}, trim:'simple' },
};
const spec = (hullClass, who, seed) => ({
  hullClass, hullShape:'auto', sailsPerMast:2, jibs:1, wear: who==='eux'?1:0, seed,
  trim:LIVERY[who].trim, emblem:'petit', flag:{...LIVERY[who].flag},
  colors:{ hull:LIVERY[who].hull, sail:LIVERY[who].sail, faction:LIVERY[who].faction },
});

let S;
function fresh() {
  S = {
    turn:1, dist:CANNON, ammo:'boulet', over:null, log:'',
    usedMan:false, usedFire:false,
    mine: { nom:'La Trompeuse', spec:spec(3,'nous',42),
            coque:100, crew:100, rig:100, hands:55,
            // Les trois postes : c'est là qu'est la décision.
            posts:{ canons:3, manoeuvre:1, pompes:1 }, leak:0 },
    theirs:{ nom:'Sancta Ana', spec:spec(3,'eux',7),
            coque:100, crew:100, rig:100, hands:60, leak:0 },
  };
  S.intent = decide();
}

/* --- effet des postes : lisible, sans table cachée --------------------- */
const POSTS = {
  canons:   { t:'Aux canons',  fx:(n)=> `Bordée ×${(0.55+0.15*n).toFixed(2)}` },
  manoeuvre:{ t:'À la manœuvre',fx:(n)=> n>=2 ? 'Peut changer de distance' : 'Trop peu pour manœuvrer' },
  pompes:   { t:'Aux pompes',  fx:(n)=> n>=2 ? 'Contient la voie d\'eau' : (n===1?'Ralentit la voie d\'eau':'L\'eau monte librement') },
};
const TOTAL_POSTS = 5;
const used = () => S.mine.posts.canons + S.mine.posts.manoeuvre + S.mine.posts.pompes;
const firePower = () => 0.55 + 0.15 * S.mine.posts.canons;
const canMan = () => S.mine.posts.manoeuvre >= 2 && S.mine.rig > 25;

/* --- résolution, sans aléatoire --------------------------------------- */
function shoot(from, to, ammoId, power) {
  const a = AMMO[ammoId]; let txt='';
  const dmg = (v) => Math.round(v * power);
  if (ammoId==='boulet')     { to.coque -= dmg(16); txt=`${a.ico} La coque encaisse.`; if(to.coque<55) to.leak=1; }
  if (ammoId==='chaine')     { to.rig   -= dmg(24); txt=`${a.ico} Le gréement tombe.`; }
  if (ammoId==='mitraille')  { to.crew  -= dmg(20); txt=`${a.ico} La mitraille balaie le pont.`; }
  if (ammoId==='explosif')   { to.coque -= dmg(9); to.crew -= dmg(9); txt=`${a.ico} Éclats partout.`; }
  to.coque=Math.max(0,to.coque); to.crew=Math.max(0,to.crew); to.rig=Math.max(0,to.rig);
  return txt;
}

function decide() {
  const t=S.theirs, m=S.mine;
  if (t.rig<=25 && S.dist<=MUSKET && t.crew>m.crew) return {k:'board'};
  if (S.dist>CANNON) return {k:'close'};
  // Elle vise ce qui la sauve : nos canons si on la mitraille, notre coque sinon.
  const ammo = S.dist<=MUSKET ? 'mitraille' : 'boulet';
  return {k:'fire', ammo};
}

function endTurn() {
  const t=S.theirs, m=S.mine;
  // Sa réponse, annoncée au tour précédent.
  if (S.intent.k==='close' && t.rig>25 && S.dist>BOARD) { S.dist--; S.log='Elle referme la distance.'; }
  else if (S.intent.k==='fire') { S.log = 'Elle riposte. ' + shoot(t,m,S.intent.ammo,0.9); }
  else if (S.intent.k==='board') { boardBy(t,m); }

  // Voie d'eau : les pompes tenues la contiennent, sinon elle ronge.
  for (const sh of [m,t]) {
    if (!sh.leak) continue;
    const held = sh===m ? (m.posts.pompes>=2 ? 2 : m.posts.pompes) : 1;
    sh.coque = Math.max(0, sh.coque - Math.max(0, 6 - held*3));
  }
  S.turn++; S.usedMan=false; S.usedFire=false;
  S.intent = decide();
  check();
}

function boardBy(att, def) {
  const ratio = att.crew / Math.max(1, def.crew);
  const loss = Math.round(18 / Math.max(.4, ratio));
  att.crew = Math.max(0, att.crew - loss);
  def.crew = Math.max(0, def.crew - Math.round(loss * ratio));
  if (def.crew <= 0 || att.crew > def.crew * 1.6) { def.struck = true; }
  else S.log = 'L\'abordage est repoussé — des deux côtés il manque du monde.';
}

function check() {
  const m=S.mine, t=S.theirs;
  if (t.coque<=0)  S.over={k:'sunk',  titre:'Coulée',   txt:'27 pièces de bois flotté. Une carcasse ne rapporte presque rien.'};
  else if (t.struck||t.crew<=0) S.over={k:'prize', titre:'Prise !', txt:'180 d\'or et le navire. C\'est pour ça qu\'on démâte au lieu de couler.'};
  else if (m.coque<=0) S.over={k:'lost', titre:'Vous sombrez', txt:'La mer a eu le dernier mot.'};
  else if (m.struck||m.crew<=0) S.over={k:'taken',titre:'Votre pont est pris', txt:'Vous vous êtes collé trop tôt.'};
}

/* --- rendu ------------------------------------------------------------- */
function drawShipInto(host, sh, facing, w) {
  host.innerHTML='';
  const gen = getGeneratedShip(sh.spec);
  const cv = document.createElement('canvas');
  const scale = Math.max(1, Math.floor(w / gen.W));
  cv.width = gen.W*scale; cv.height = gen.H*scale;
  drawShip(cv, { spriteSpec: sh.spec, facing, waterline:false });
  // B3 donnerait ici un sprite avarié ; en B2 on se contente d'un voile.
  cv.style.opacity = sh.coque<40 ? .82 : 1;
  cv.style.filter = sh.rig<=25 ? 'grayscale(.35)' : 'none';
  host.appendChild(cv);
  host.appendChild(Object.assign(document.createElement('div'),
    {className:'nm', textContent: sh.nom}));
  const bits=[]; if(sh.rig<=25) bits.push('démâtée'); if(sh.leak) bits.push('voie d\'eau');
  host.appendChild(Object.assign(document.createElement('div'),
    {className:'sub', textContent: bits.length?bits.join(' · '):' '}));

  const g=document.createElement('div'); g.className='gauges';
  g.appendChild(gauge('coque','Coque', sh.coque, !sh.mineSide));
  g.appendChild(gauge('crew','Équipage', sh.crew, !sh.mineSide));
  host.appendChild(g);
}
function gauge(cls, label, val, aimable) {
  const d=document.createElement('div');
  d.className='g '+cls+(aimable?' aimable':'');
  d.innerHTML=`<span class="lb">${label}</span><span class="track">
    <span class="fill" style="width:${val}%"></span><span class="num">${Math.round(val)}</span></span>`;
  return d;
}

function render() {
  const m=S.mine, t=S.theirs;
  m.mineSide=true; t.mineSide=false;

  document.getElementById('range').innerHTML =
    RANGES.map((r,i)=> i===S.dist?`<b>${r}</b>`:r).reverse().join(' · ') +
    `<span class="turn">Tour ${S.turn}</span>`;

  drawShipInto(document.getElementById('mine'), m, 1, 210);
  drawShipInto(document.getElementById('theirs'), t, -1, 180);

  // Postes — le curseur de décision
  const P=document.getElementById('posts');
  P.innerHTML=`<h4>Répartition de l'équipage <small>${used()} / ${TOTAL_POSTS} postes tenus · les hommes ne peuvent pas être à deux endroits</small></h4>`;
  const row=document.createElement('div'); row.className='postrow';
  for (const k of ['canons','manoeuvre','pompes']) {
    const n=m.posts[k];
    const d=document.createElement('div'); d.className='post';
    d.innerHTML=`<div class="t">${POSTS[k].t}</div><div class="v">${n}</div>
      <div class="fx">${POSTS[k].fx(n)}</div>`;
    const b=document.createElement('div'); b.className='btns';
    const minus=Object.assign(document.createElement('button'),{textContent:'−'});
    const plus =Object.assign(document.createElement('button'),{textContent:'+'});
    minus.disabled = n<=0 || S.over;
    plus.disabled  = used()>=TOTAL_POSTS || S.over;
    minus.onclick=()=>{ m.posts[k]--; render(); };
    plus.onclick =()=>{ m.posts[k]++; render(); };
    b.append(minus,plus); d.appendChild(b); row.appendChild(d);
  }
  P.appendChild(row);

  const iv=S.intent;
  document.getElementById('intent').innerHTML = iv
    ? `⚠ <b>Elle va</b> : ` + (iv.k==='fire' ? `tirer ${AMMO[iv.ammo].ico} ${AMMO[iv.ammo].nom}`
      : iv.k==='close' ? 'refermer la distance' : 'vous aborder')
    : '';

  // Munitions
  const A=document.getElementById('ammo'); A.innerHTML='';
  for (const [id,a] of Object.entries(AMMO)) {
    const b=document.createElement('button');
    b.className = S.ammo===id?'on':'';
    b.innerHTML=`<span>${a.ico}</span><span>${a.nom}</span>`;
    b.disabled = S.dist > a.max;
    b.title = S.dist>a.max ? 'Hors de portée' : a.hint;
    b.onclick=()=>{ S.ammo=id; render(); };
    A.appendChild(b);
  }
  document.getElementById('hint').textContent = AMMO[S.ammo].hint;

  // Actions
  const C=document.getElementById('acts'); C.innerHTML='';
  const mk=(label,why,fn,cta)=>{
    const b=document.createElement('button'); if(cta) b.className='cta';
    b.innerHTML=`<span>${label}</span>`+(why?`<span class="why">${why}</span>`:'');
    b.disabled=!!why; if(!why) b.onclick=fn; C.appendChild(b);
  };
  const tooFar = S.dist > AMMO[S.ammo].max;
  mk(`${AMMO[S.ammo].ico} Tirer`,
     S.over?'—':S.usedFire?'Déjà tiré':tooFar?'Hors de portée':null,
     ()=>{ S.usedFire=true; S.log = shoot(m,t,S.ammo,firePower()); check(); render(); }, true);
  mk('→ S\'approcher',
     S.over?'—':S.usedMan?'Déjà manœuvré':!canMan()?'2 hommes à la manœuvre':S.dist===BOARD?'—':null,
     ()=>{ S.usedMan=true; S.dist--; render(); });
  mk('← Rompre',
     S.over?'—':S.usedMan?'Déjà manœuvré':!canMan()?'2 hommes à la manœuvre':S.dist===FAR?'—':null,
     ()=>{ S.usedMan=true; S.dist++; render(); });
  mk('⚔ Aborder',
     S.over?'—':S.dist!==BOARD?'Bord à bord':null,
     ()=>{ boardBy(m,t); S.usedFire=S.usedMan=true; check(); render(); });
  mk('⏭ Fin de tour', S.over?'—':null, ()=>{ endTurn(); render(); });

  document.getElementById('log').textContent = S.log || ' ';

  document.querySelector('.over')?.remove();
  if (S.over) {
    const o=document.createElement('div'); o.className='over';
    o.innerHTML=`<h2>${S.over.titre}</h2><p>${S.over.txt}</p>`;
    const b=Object.assign(document.createElement('button'),{textContent:'↺ Rejouer'});
    b.onclick=()=>{ fresh(); render(); };
    o.appendChild(b); document.body.appendChild(o);
  }
}

fresh(); render();
</script>
</body>
</html>
