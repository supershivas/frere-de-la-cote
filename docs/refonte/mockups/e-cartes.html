<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>E — la chasse-partie en cartes (maquette jouable)</title>
<!-- titre: La chasse-partie -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%8F%B4%3C/text%3E%3C/svg%3E">
</head>
<body data-bg="sea">
<canvas id="ocean"></canvas>
<div id="parchment"></div>
<main id="app"></main>

<script type="module">
/* ============================================================
   E — LA CHASSE-PARTIE EN CARTES.

   Ce qui vient du jeu, et n'est pas réinventé ici :
     src/cartes.js         les règles, pures et sans dé
     src/sprites.js        les coques, générées à l'exécution
     src/ocean.js          le ciel et la mer animés
     src/fx.js             la fumée, les éclats, les nombres flottants
     data/equipage.json    l'équipage, les prises, les intentions, les reliques
     data/weather.json     la météo, avec ses vrais modificateurs
     data/phylacteres.json les voix de l'équipage
     css/style.css         l'interface (§17 de css/deck.css pour cet écran)

   MOBILE D'ABORD, et rien en bas de l'écran qu'un râtelier de bois : l'ordre
   est un GESTE. On touche pour choisir ses hommes, on pousse la volée vers la
   zone qui s'ouvre sous La Tortue, elle part. Monter puis redescendre annule.
   ============================================================ */

import * as C from './src/cartes.js';
import * as Voy from './src/voyage.js';
import { coastlines, places, routeEntre } from './src/caribbean.js';
import { getGeneratedShip, drawGrid } from './src/sprites.js';
import { startOcean, randomOceanScene } from './src/ocean.js';
import { initFx, fxFloatText } from './src/fx.js';

const el = (tag, o = {}, kids = []) => {
  const n = document.createElement(tag);
  if (o.class) n.className = o.class;
  if (o.text !== undefined) n.textContent = o.text;
  if (o.html !== undefined) n.innerHTML = o.html;
  if (o.attrs) for (const [k, v] of Object.entries(o.attrs)) n.setAttribute(k, v);
  if (o.on) for (const [e, f] of Object.entries(o.on)) n.addEventListener(e, f);
  for (const k of [].concat(kids)) if (k != null) n.appendChild(typeof k === 'string' ? document.createTextNode(k) : k);
  return n;
};
const app = () => document.getElementById('app');
const attendre = (ms) => new Promise((r) => setTimeout(r, ms));

const jget = async (p) => (await fetch(p)).json();
const [CONTENU, METEO, PHY] = await Promise.all([
  jget('data/equipage.json'), jget('data/weather.json'), jget('data/phylacteres.json'),
]);
const METEO_CLES = Object.keys(METEO);

/* L'aléatoire vit ici, dans la GÉNÉRATION, et nulle part ailleurs. */
let graine = (Math.random() * 4294967295) >>> 0;
const rngPour = (s) => { let x = s >>> 0 || 1; return () => { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; }; };
let rng = rngPour(graine);

const P = C.nouvellePartie(CONTENU);
const V = Voy.nouveauVoyage();
// LA CARTE DES CARAÏBES EST FERMÉE POUR L'INSTANT. On teste les combats, donc
// on y entre directement : `retourAuJeu()` engage la prise suivante au lieu
// d'ouvrir la carte. Rien n'est supprimé — `ecranCarte()` et `src/voyage.js`
// restent entiers, et `CARTE_OUVERTE = true` rallume le tout tel quel.
const CARTE_OUVERTE = false;
let ecran = CARTE_OUVERTE ? 'carte' : 'chasse';
let trouve = null;        // ce qu'une épave vient de rendre
let viseeCarte = null;    // l'escale visée, en attente de confirmation
let rencontre = null;     // la rencontre en cours
let mot = '';            // la dernière chose qui s'est passée, en une ligne
let occupe = false;      // une animation est en cours : les gestes sont sourds
let neuves = [];         // les `uid` relevés au dernier tour, pour l'animation

// On refait la main à ras en gardant trace de QUI vient d'arriver : c'est ce
// qui permet de ne faire voler que les nouvelles cartes.
function relever(combien) {
  const avant = new Set(P.main.map((c) => c.uid));
  C.completer(P, rng, combien);
  neuves = P.main.filter((c) => !avant.has(c.uid)).map((c) => c.uid);
}

/* ------------------------------------------------------------- la houle
   L'amplitude vient de la météo réelle : un calme plat ne berce pas comme un
   grain. C'est décoratif, mais c'est la seule chose qui dise « ce navire
   flotte » plutôt que « ce navire est collé au fond de l'écran ». */
// L'AMPLITUDE SE COMPTE EN RANGS DE COQUE, pas en pixels choisis à l'œil : un
// navire est peint à 3 px par rang, si bien qu'un enfoncement de 6 px cache
// deux rangs de bordé et se VOIT. À 2 px, la houle était mathématiquement là
// et visuellement absente. Le plafond est de cinq rangs : au-delà, la coque
// disparaissait tout entière et il ne restait qu'une mâture posée sur l'eau.
const HOULE = {
  calme: { amp: 2, gite: 0.3, periode: 8 },
  brise: { amp: 5, gite: 0.9, periode: 5.4 },
  vent_fort: { amp: 8, gite: 2.4, periode: 3.6 },
  brume: { amp: 4, gite: 0.6, periode: 6.4 },
  grain: { amp: 11, gite: 3.4, periode: 2.9 },
  tempete: { amp: 15, gite: 5, periode: 2.4 },
};
const houle = () => HOULE[P.meteo && P.meteo.id] || HOULE.brise;

/* ------------------------------------------------------------- les coques */

// Une coque générée porte SA PALETTE : ses caractères sont ceux du générateur.
// Lui passer une couleur unique fait retomber chaque caractère inconnu sur
// cette couleur — coque en aplat, sans voiles ni pavillon, sans erreur levée.
//
// Le canvas est RECADRÉ à la ligne de flottaison : la mer vient exactement au
// bas de l'image, donc aligner deux coques par le bas les aligne par la
// flottaison, quelles que soient leurs tailles de grille.
function peindreCoque(cv, spec, facing, { feu = 0, px = 3 } = {}) {
  if (!cv) return;
  const g = getGeneratedShip(spec);
  const grille = (g.grid || g).map((r) => (typeof r === 'string' ? r : r.join('')));
  const cols = grille[0].length, rows = grille.length;
  const eau = g.waterY != null ? g.waterY : rows - 1;

  // ON NE MONTRE PAS LA FLOTTAISON. Ni bande de vagues, ni découpe dessinée,
  // ni œuvres vives : `drawGrid` coupe la coque à la ligne d'eau et l'on
  // s'arrête là. Tout ce qui a été tenté pour la rendre visible — un bord
  // mangé en creux, une frange d'écume, un train d'ondes par-dessus — se
  // remarquait plus que la mer elle-même. Il ne reste que le MOUVEMENT des
  // navires, qui suffit à dire qu'ils flottent.
  const off = document.createElement('canvas');
  off.width = cols * px; off.height = rows * px;
  drawGrid(off, grille, { color: g.palette, flag: '', facing, waterRow: eau });

  cv.width = cols * px; cv.height = (eau + 1) * px;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0);

  cv.dataset.flottaison = String((eau + 1) * px);
  cv.dataset.eau = String((eau + 1) * px);
  cv.dataset.pont = String(Math.round((eau - 3) * px));
  // LES SABORDS, relevés dans la grille elle-même. Le générateur les marque
  // d'un caractère ('p') : on note où ils sont, en pixels du canvas, pour que
  // la fumée et les boulets partent de là et pas d'un point moyen inventé.
  sabordsDe(cv, grille, px, facing, eau);
  if (feu > 0) allumer(cv, feu, px, eau, facing);
}

// LE FEU FUME EN CONTINU. Peint dans le canvas, il ne bougeait qu'à la
// repeinte — c'est-à-dire une fois par tour : un incendie figé. La braise
// reste peinte (elle appartient à la coque), la fumée est un panache de DOM
// qui monte tant que le navire brûle.
let braise = 0;
// Chaque coque a sa propre phase de vague : deux navires n'entrent pas dans
// l'eau au même endroit de la même houle.
const PHASES = { 'c-nous': 0, 'c-prise': 2.1 };
const phaseHoule = (id) => (PHASES[id] || 0) + braise * 0.6;
let panache = null;
function fumerEnContinu() {
  clearInterval(panache);
  const feux = () => [
    { id: 'c-nous', f: 1 },
    { id: 'c-prise', f: P.prise ? P.prise.pv / P.prise.max : 1 },
  ].filter((x) => x.f < 0.4 && document.getElementById(x.id));
  panache = setInterval(() => {
    if (ecran !== 'chasse') return;
    for (const { id, f } of feux()) {
      const cv = document.getElementById(id);
      const r = cv.getBoundingClientRect();
      const gros = f < 0.2 ? 1.6 : 1.1;
      // Une masse qui monte et se délite, pas un rond : `volute` tire un
      // contour irrégulier par bouffée. La fumée d'incendie monte plus haut
      // et plus lentement que celle d'un canon.
      volute('fumee', {
        x: r.left + r.width * (0.35 + Math.random() * 0.3),
        y: r.top + r.height * 0.66,
      }, {
        largeur: 26 * gros, hauteur: 24 * gros,
        vers: (Math.random() - 0.35) * 26, monte: -62 * gros,
        duree: 2200 + Math.random() * 900, lobes: 4, graine: Math.random() * 100,
      });
    }
  }, 340);
}
function allumer(cv, force, px, eau, facing) {
  const ctx = cv.getContext('2d');
  const pont = (eau - 5) * px;
  const largeur = cv.width;
  const n = 4 + force * 5;
  for (let i = 0; i < n; i++) {
    const t = (i * 2.399 + braise) % 1;
    const x = Math.round((0.28 + t * 0.44) * largeur) + (facing === 1 ? -6 : 6);
    const h = 2 + ((i * 7 + braise * 13) % 5);
    ctx.fillStyle = i % 3 === 0 ? 'rgba(255,214,102,.95)' : i % 3 === 1 ? 'rgba(240,120,32,.9)' : 'rgba(180,42,18,.85)';
    ctx.fillRect(x, pont - h * px, px, h * px);
  }
  ctx.fillStyle = 'rgba(60,54,48,.35)';
  for (let i = 0; i < 5; i++) {
    const x = Math.round((0.3 + ((i * 0.17 + braise * 0.1) % 0.4)) * largeur);
    ctx.fillRect(x, pont - (10 + i * 3) * px, px * 3, px * 2);
  }
}

const SABORDS = new Map();
function sabordsDe(cv, grille, px, facing, eau) {
  const cols = grille[0].length;
  const pts = [];
  for (let y = 0; y <= eau; y++) {
    for (let x = 0; x < cols; x++) {
      if (grille[y][x] !== 'p') continue;
      const vx = facing === 1 ? x : cols - 1 - x;
      pts.push({ x: (vx + 0.5) * px, y: (y + 0.5) * px });
    }
  }
  SABORDS.set(cv.id, pts);
}

// Les sabords en coordonnées d'écran, pour un tir donné. On prend ceux du
// côté qui tire — un boulet ne sort pas par la poupe.
function bouches(id, sens) {
  const cv = document.getElementById(id);
  const pts = SABORDS.get(id) || [];
  if (!cv || !pts.length) return [centre(id, sens === 1 ? 0.82 : 0.18, 0.42)];
  const r = cv.getBoundingClientRect();
  const kx = r.width / cv.width, ky = r.height / cv.height;
  const ecran = pts.map((p) => ({ x: r.left + p.x * kx, y: r.top + p.y * ky }));
  ecran.sort((a, b) => (sens === 1 ? b.x - a.x : a.x - b.x));
  return ecran.slice(0, Math.max(1, Math.min(4, Math.ceil(ecran.length / 2))));
}

const specNous = () => ({
  seed: 4211, hullClass: 4, hullShape: 'fine', sailsPerMast: 3, jibs: 1, wear: 0,
  colors: { hull: '#5a3d25', sail: '#e6d9bd', faction: '#8a1f1f' },
  flag: { motif: 'Crâne', bg: '#161616', sym: '#e6d9bd', accent: '#f1c40f' },
  trim: 'simple', emblem: 'petit',
});
const specPrise = () => ({
  seed: P.prise.sceau || 9137, hullClass: P.prise.hullClass, hullShape: 'ronde',
  sailsPerMast: 3, jibs: 2, wear: 1,
  colors: { hull: '#6b4a26', sail: '#f0e6cc', faction: '#c8a227' },
  flag: { motif: 'Croix', bg: '#f0e6cc', sym: '#a3242a', accent: '#c8a227' },
  trim: 'doré', emblem: 'grand',
});

function peindreCoques() {
  braise += 1;
  // La Tortue n'a plus de points de vie : elle ne brûle plus. C'est la prise
  // qui fume, et seulement elle.
  const feuNous = 0;
  const feuElle = P.prise.pv / P.prise.max < 0.4 ? (P.prise.pv / P.prise.max < 0.2 ? 2 : 1) : 0;
  // UNE SEULE ÉCHELLE pour les deux coques, calculée sur la plus haute et sur
  // la bande de mer disponible. Deux échelles différentes faisaient de la
  // frégate et de la barque deux jouets sans rapport de taille ; et une
  // échelle fixe débordait vers le haut, poussant les plaques par-dessus le
  // ruban — un débordement qu'`overflow: hidden` aurait masqué en silence.
  // On mesure la BANDE, jamais le conteneur des coques : celui-ci tire sa
  // hauteur du canvas qu'on est en train de dimensionner, et chaque repeinte
  // rétrécissait les navires un peu plus. Une boucle de rétroaction silencieuse
  // — rien n'échoue, les navires deviennent seulement minuscules.
  const bande = document.querySelector('.ecran-cartes .mer');
  const plaques = document.querySelector('.ecran-cartes .etiquettes');
  const dispo = bande ? (bande.clientHeight - (plaques ? plaques.offsetHeight : 0) - 8) * 0.84 : 120;
  const hauteurs = [specNous(), specPrise()].map((s) => {
    const g = getGeneratedShip(s);
    return (g.waterY != null ? g.waterY : (g.grid || g).length - 1) + 1;
  });
  const px = Math.max(1, Math.min(5, Math.floor(dispo / Math.max(...hauteurs))));
  peindreCoque(document.getElementById('c-nous'), specNous(), 1, { feu: feuNous, px });
  peindreCoque(document.getElementById('c-prise'), specPrise(), -1, { feu: feuElle, px });
  const h = houle();
  for (const id of ['c-nous', 'c-prise']) {
    const cv = document.getElementById(id);
    if (!cv) continue;
    cv.style.setProperty('--amp', `${h.amp}px`);
    cv.style.setProperty('--gite', `${h.gite}deg`);
    cv.style.setProperty('--periode', `${h.periode + (id === 'c-prise' ? 0.7 : 0)}s`);
    // Les deux navires ne montent pas sur la même vague : un décalage suffit à
    // ce que la mer ait l'air d'une mer et non d'un plateau qui bascule.
    cv.style.setProperty('--decalage', id === 'c-prise' ? '-1.3s' : '0s');
  }
}

/* ------------------------------------------------------------ le boulet */
// Un tir se suit des yeux : bouffée au départ, boulet en vol, éclat à
// l'arrivée, chiffre qui monte. Les deux tirs sont SÉQUENTIELS — le nôtre,
// puis le sien — parce que deux fumées simultanées ne racontent rien.
function centre(id, dx = 0.5, dy = 0.45) {
  const n = document.getElementById(id);
  if (!n) return { x: innerWidth / 2, y: innerHeight / 2 };
  const r = n.getBoundingClientRect();
  return { x: r.left + r.width * dx, y: r.top + r.height * dy };
}
// TOUT CE QUI VOLE VIT DANS LA MER, PAS DANS LA PAGE.
//
// Les boulets, les copeaux et la fumée étaient posés sur `document.body` en
// `position: fixed`. Résultat mesuré : un boulet dont la transformation disait
// `translate(96px, 341px)` était rapporté par le navigateur à y = 1008, un
// écran plus bas — invisible, à chaque tir, depuis le début. Le repère d'un
// élément fixé dépend de ses ancêtres (`transform`, `filter`, `contain`…), et
// s'appuyer dessus, c'est bâtir sur une hypothèse qu'on ne contrôle pas.
//
// Ils sont maintenant posés DANS la bande de mer, en coordonnées relatives à
// elle : le repère est celui du décor où ils volent, ils sont détourés avec
// lui, et la question ne peut plus se reposer.
const laMer = () => document.querySelector('.screen.ecran-cartes .mer');

// Un point de l'écran ramené dans le repère de la mer.
function dansLaMer(pt) {
  const m = laMer();
  if (!m) return pt;
  const r = m.getBoundingClientRect();
  return { x: pt.x - r.left, y: pt.y - r.top };
}
function poser(classe) {
  const m = laMer();
  const d = el('div', { class: classe });
  (m || document.body).appendChild(d);
  return d;
}

// DES ÉCLATS. Un boulet dans un bordé de chêne n'ouvre pas un trou net : il
// arrache des copeaux, qui volent plus loin que la fumée. C'est ce qui dit
// « la coque a pris » plutôt que « quelque chose a explosé ».
function copeaux(pt, n = 10, teintes = ['#b98a4b', '#8a6234', '#e6d9bd', '#5a3d25']) {
  const o = dansLaMer(pt);
  for (let i = 0; i < n; i++) {
    const d = poser('copeau');
    const ang = (Math.PI * (0.15 + Math.random() * 0.7)) * (Math.random() < 0.5 ? 1 : -1) + Math.PI;
    const dist = 22 + Math.random() * 46;
    const dx = Math.cos(ang) * dist, dy = -Math.abs(Math.sin(ang)) * dist * 0.7 + 12;
    d.style.left = `${o.x}px`; d.style.top = `${o.y}px`;
    d.style.background = teintes[i % teintes.length];
    d.style.width = `${2 + Math.random() * 3}px`;
    d.style.height = `${1 + Math.random() * 2}px`;
    d.animate(
      [{ transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy + 26}px) rotate(${Math.random() * 540 - 270}deg)`, opacity: 0 }],
      { duration: 420 + Math.random() * 320, easing: 'cubic-bezier(.2,.7,.4,1)' },
    ).onfinish = () => d.remove();
  }
}

// LA FUMÉE : UNE SEULE MASSE, pas une grappe de ronds.
//
// Une bordée ne fait pas six ronds de fumée côte à côte : elle fait UN nuage,
// bosselé, qui sort du flanc. Six éléments semi-transparents laissaient voir
// tous leurs recouvrements — exactement le défaut des nuages du ciel, et la
// même correction : une seule surface, dont le contour irrégulier vient de
// plusieurs lobes peints DANS le même élément, plus un flou qui les soude.
function volute(classe, pt, { largeur = 30, hauteur = 26, vers = 0, monte = -18, duree = 1100, lobes = 4, graine = 0 } = {}) {
  const o = dansLaMer(pt);
  const d = poser(classe);
  const h = (n) => { const v = Math.sin((graine + 1) * 12.9898 + n * 78.233) * 43758.5453; return v - Math.floor(v); };
  const couches = [];
  for (let i = 0; i < lobes; i++) {
    const cx = 18 + h(i) * 64;
    const cy = 26 + h(i + 7) * 48;
    const r = 26 + h(i + 13) * 22;
    couches.push(`radial-gradient(${r}% ${r * 1.1}% at ${cx}% ${cy}%, var(--coeur) 0%, var(--bord) 62%, transparent 78%)`);
  }
  d.style.backgroundImage = couches.join(',');
  d.style.left = `${o.x}px`; d.style.top = `${o.y}px`;
  d.style.width = `${largeur}px`; d.style.height = `${hauteur}px`;
  d.animate([
    { transform: 'translate(-50%,-50%) scale(.4) rotate(0deg)', opacity: 0 },
    { transform: `translate(calc(-50% + ${vers * 0.4}px), calc(-50% + ${monte * 0.35}px)) scale(1.1) rotate(${vers > 0 ? 14 : -14}deg)`, opacity: .9, offset: .28 },
    { transform: `translate(calc(-50% + ${vers}px), calc(-50% + ${monte}px)) scale(2.2) rotate(${vers > 0 ? 40 : -40}deg)`, opacity: 0 },
  ], { duration: duree, easing: 'cubic-bezier(.15,.6,.4,1)' }).onfinish = () => d.remove();
  return d;
}

// LA BOUFFÉE D'UNE BORDÉE : une seule masse posée sur le flanc, large comme
// la rangée de sabords, et qui part vers l'extérieur.
function bouffee(pts, sens, taille = 1) {
  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  const centreX = (Math.min(...xs) + Math.max(...xs)) / 2;
  const centreY = (Math.min(...ys) + Math.max(...ys)) / 2;
  const etendue = Math.max(38, Math.max(...xs) - Math.min(...xs) + 40);
  volute('boufee', { x: centreX + sens * 8, y: centreY }, {
    largeur: etendue * taille, hauteur: (Math.max(...ys) - Math.min(...ys) + 42) * taille,
    vers: sens * (26 + Math.random() * 14), monte: -8 - Math.random() * 8,
    duree: 1000, lobes: 5, graine: Math.random() * 100,
  });
}

// L'IMPACT. Un boulet dans un bordé de chêne ne fait pas une boule de feu
// orange : il fait un choc clair très bref, une masse de poussière sale qui
// s'ouvre vers l'extérieur, et surtout du BOIS QUI VOLE. C'est le bois qui
// dit que la coque a pris ; la fumée seule dit « quelque chose a explosé ».
function impact(pt) {
  // Le choc : un éclat de lumière très court, pas une explosion.
  const f = poser('choc');
  const o = dansLaMer(pt);
  f.style.left = `${o.x}px`; f.style.top = `${o.y}px`;
  f.animate([
    { transform: 'translate(-50%,-50%) scale(.3)', opacity: .95 },
    { transform: 'translate(-50%,-50%) scale(1.5)', opacity: 0 },
  ], { duration: 180, easing: 'ease-out' }).onfinish = () => f.remove();

  // La poussière : une seule masse, sale, qui s'ouvre et retombe.
  volute('poussiere', pt, {
    largeur: 46, hauteur: 34,
    vers: (Math.random() - 0.5) * 18, monte: -10,
    duree: 1400, lobes: 5, graine: Math.random() * 100,
  });

  // Le bois. Beaucoup, de la couleur du bordé : c'est lui qui dit que la coque
  // a pris. Il n'y a plus de tir au gréement, donc plus de toile qui vole.
  copeaux(pt, 20, ['#b98a4b', '#8a6234', '#5a3d25', '#e6d9bd', '#3a2712']);
}

// LE BOULET. Il était noir, minuscule, et rapporté hors de l'écran : personne
// ne l'a jamais vu. Il est clair, plus gros, plus lent, et il traîne un
// sillage — c'est le sillage qu'on suit des yeux, pas la bille.
function boulet(a, b, duree = 620) {
  return new Promise((fini) => {
    const oa = dansLaMer(a), ob = dansLaMer(b);
    const d = poser('boulet');
    const arc = Math.min(70, Math.abs(ob.x - oa.x) * 0.26);
    const t0 = performance.now();
    let dernier = 0;
    const pas = (t) => {
      const k = Math.min(1, (t - t0) / duree);
      const x = oa.x + (ob.x - oa.x) * k;
      const y = oa.y + (ob.y - oa.y) * k - Math.sin(k * Math.PI) * arc;
      d.style.transform = `translate(${x - 8}px, ${y - 8}px)`;
      if (t - dernier > 45 && k < 0.92) {
        dernier = t;
        const f = poser('boulet-sillage');
        f.style.transform = `translate(${x - 6}px, ${y - 6}px)`;
        setTimeout(() => f.remove(), 620);
      }
      if (k < 1) requestAnimationFrame(pas); else { d.remove(); fini(); }
    };
    requestAnimationFrame(pas);
  });
}

async function tir(deId, versId, sens, texte, ton, { cible = 'coque' } = {}) {
  const ports = bouches(deId, sens);
  const cv = document.getElementById(versId);
  const r = cv ? cv.getBoundingClientRect() : null;
  // OÙ LE BOULET FRAPPE. À la coque, c'est le bordé entre le pont et l'eau —
  // pas le milieu de l'image, qui tombait dans les voiles. On se sert des
  // repères relevés à la peinture : `pont` et `flottaison`, en pixels du
  // canvas, ramenés à l'échelle d'affichage.
  const ech = cv && r ? r.height / cv.height : 1;
  const pont = cv ? Number(cv.dataset.pont || 0) * ech : 0;
  const flot = cv ? Number(cv.dataset.flottaison || cv.height) * ech : 0;
  const b = r
    ? {
      x: r.left + r.width * (0.36 + Math.random() * 0.28),
      y: r.top + pont + (flot - pont) * (0.35 + Math.random() * 0.45),
    }
    : centre(versId, 0.5, 0.45);

  // Toutes les bouches tirent, décalées de quelques millisecondes : c'est ce
  // décalage qui fait entendre une bordée plutôt qu'un coup.
  bouffee(ports, sens, 1);
  await attendre(120 + ports.length * 30);

  await Promise.all(ports.map((pt, i) => attendre(i * 45).then(() => boulet(pt, {
    x: b.x + (Math.random() - 0.5) * 22, y: b.y + (Math.random() - 0.5) * 16,
  }, 520 + i * 30))));

  impact(b, cible);
  if (texte) fxFloatText(b.x, b.y - 26, texte, ton);
  await attendre(280);
}

/* ------------------------------------------------------------ phylactères */
// La réplique la plus SPÉCIFIQUE d'abord : une phrase sur la mer d'huile
// pendant une tempête casse le peu de fiction qu'un phylactère porte. Les
// étiquettes du tirage (`quand`) sont celles de la météo et de la prise ;
// une réplique sans étiquette est un filet, elle ne sort que faute de mieux.
function phylactere(moment, etiquettes = []) {
  const toutes = (PHY.repliques || []).filter((r) => r.moment === moment);
  const precises = toutes.filter((r) => (r.quand || []).some((q) => etiquettes.includes(q)));
  const lignes = precises.length ? precises : toutes.filter((r) => !r.quand || !r.quand.length);
  if (!lignes.length) return;
  const r = lignes[Math.floor(rng() * lignes.length)];
  const v = PHY.voix[r.voix] || { nom: r.voix, role: '' };
  mot = `<b>${v.nom}</b> : « ${r.texte} »`;
}

/* --------------------------------------------------------------- prises */
// Le seul chemin de retour au jeu depuis un écran d'entre-deux : la carte si
// elle est ouverte, sinon l'escale de chasse la plus proche. Un seul endroit,
// pour qu'on n'ait pas à retrouver six `ecran = 'carte'` le jour où la carte
// rouvre.
function retourAuJeu() {
  if (CARTE_OUVERTE) { ecran = 'carte'; rendre(); return; }
  const ouvertes = Voy.escales(V);
  const cible = ouvertes.find((o) => o.type === 'chasse' || o.type === 'boss') || ouvertes[0];
  if (!cible) { ecran = 'carte'; rendre(); return; }
  aborder(cible);
}
function engagerPrise(place) {
  const def = Voy.priseDe(V, place, CONTENU, rng);
  const meteo = METEO[METEO_CLES[Math.floor(rng() * METEO_CLES.length)]];
  C.engager(P, def, meteo, rng);
  neuves = P.main.map((c) => c.uid);
  randomOceanScene(meteo.id);
  ecran = 'chasse'; mot = '';
  phylactere('ouverture', [meteo.id, def.id, def.rang]);
  rendre();
  // Le mot d'ouverture appartient au premier COMBAT, pas au premier écran :
  // expliquer ce qu'est une volée devant une carte marine n'apprend rien.
  motPremier();
  if (!tuto.fini) tutoLancer();
}

// Ce qu'une escale déclenche. Chaque type dit d'abord ce qu'il est (§10.3 du
// brief) : aucun nœud n'est une distributrice, aucun n'est une surprise.
function aborder(place) {
  const r = Voy.cingler(V, place.id);
  if (!r.ok) { mot = r.pourquoi; rendre(); return; }
  switch (place.type) {
    case 'chasse':
    case 'boss':
      engagerPrise(place);
      break;
    case 'port':
      mot = `${place.name} : on relâche, et l'on recrute.`;
      lotPour = -1; ecran = 'partage'; rendre();
      break;
    case 'epave':
      trouve = Voy.trouvaille(P, CONTENU, rng);
      if (trouve) {
        if (trouve.genre === 'relique') P.reliques.push(trouve.def.id);
        else P.officiers.push(trouve.def.id);
      }
      ecran = 'epave'; rendre();
      break;
    default:
      rencontre = Voy.rencontreDe(V, rng);
      ecran = 'rencontre'; rendre();
  }
}

/* ------------------------------------------------------------ le tableau *//* ------------------------------------------------------------ le tableau */
function tableau() {
  const t = el('div', { class: `tableau${P.selection.length ? ' arme' : ''}` });
  if (!P.selection.length) {
    t.appendChild(el('div', { class: 'tb-tete' }, [el('span', { class: 'tb-cible', text: 'Personne à la manœuvre' })]));
    t.appendChild(el('div', {
      class: 'tb-detail',
      html: mot || 'Une <b>volée</b>, c’est le groupe d’hommes que tu envoies tirer <b>ensemble</b> : '
        + 'jusqu’à trois, tous du <b>même bord</b>. Touche-les pour les y mettre.',
    }));
    const reste = Math.max(0, P.prise.resistance - P.pression);
    t.appendChild(el('div', {
      class: 'tb-geste',
      text: `encore ${reste} de pression en ${P.bordees} bordée${P.bordees > 1 ? 's' : ''} · ${P.rechargements} rechargement${P.rechargements > 1 ? 's' : ''}`,
    }));
    return t;
  }
  const r = C.evaluer(P, P.selection);

  // CE QUE LA VOLÉE FAIT, EN UNE PHRASE ET DEUX CHIFFRES : la PRESSION qu'elle
  // met — le seul compteur qui décide de la fin — et ce qu'elle entame en
  // passant. Les deux se lisent au même endroit, au moment du choix.
  const MANIERES = {
    coque: { nom: 'À la coque', dit: 'les boulets entrent dans le bordé : elle pousse et elle abîme' },
    abordage: { nom: 'À l’abordage', dit: 'on saute à bord : c’est ce qui pousse le plus fort' },
    radoub: { nom: 'Au radoub', dit: 'personne ne tire : le charpentier jette les Feux par-dessus bord' },
  };
  const m = MANIERES[r.cible] || MANIERES.coque;
  t.appendChild(el('div', { class: 'tb-tete' }, [
    el('span', { class: 'tb-cible', text: m.nom }),
    el('span', { class: 'tb-prix' }, [
      el('span', { class: 'tb-pression', text: `+${r.pression} ⚑` }),
      // CE QUE LA VOLÉE EMPÊCHE se lit à côté de ce qu'elle met : couper la
      // carte annoncée est une décision au même titre que le chiffre, et elle
      // était reléguée en fin de troisième ligne, où elle passait à la coupe.
      r.annule
        ? el('span', { class: 'tb-coupe', text: '✕ sa carte' })
        : r.degats > 0
          ? el('span', { class: 'tb-degats', text: `${r.degats} ⚔ coque` })
          : el('span', { class: 'tb-sauf', text: r.cible === 'radoub' ? 'les Feux à l’eau' : 'coque intacte' }),
    ]),
  ]));
  t.appendChild(el('div', { class: 'tb-detail', text: m.dit }));

  // Ce que la volée LAISSE : la pression qu'il restera à mettre, et sur quel
  // nombre de bordées. C'est la seule projection dont le joueur a besoin.
  const apres = P.pression + r.pression;
  const manque = Math.max(0, P.prise.resistance - apres);
  const coque = Math.max(0, P.prise.pv - r.degats);
  t.appendChild(el('div', {
    class: 'tb-geste',
    html: r.cible === 'radoub' ? 'une volée d’un seul charpentier répare et jette un Feu'
      : manque === 0 ? '<b>elle amène son pavillon</b>'
        : coque === 0 ? '<b>coulée avant de se rendre : on ne repêche que ce qui flotte</b>'
          : `resterait ${manque} en ${Math.max(0, P.bordees - 1)} bordée${P.bordees - 1 > 1 ? 's' : ''}`
            + (r.annule ? ' · <b>elle ne jouera pas sa carte</b>' : ` · ${r.degats} à sa coque`),
  }));
  return t;
}

/* ------------------------------------------------- ce qu'une carte a à dire
   IL N'Y A PLUS D'INFOBULLE. Elle était ancrée au-dessus de ce qu'on touchait,
   et à cette taille d'écran elle recouvrait la mer, la carte d'intention, ou
   la main elle-même : un panneau flottant sur un écran de 375 px cache
   toujours quelque chose qu'on était en train de lire.

   Ce qu'une carte a à dire s'écrit DANS LE TABLEAU, à la place de la réplique
   d'équipage, tant que le doigt reste posé dessus. Une ligne, deux au plus. Au
   relâchement, le tableau reprend son contenu. Le tableau est déjà l'endroit
   où l'on lit ce qu'on est en train de faire ; il n'y a pas de raison d'en
   ouvrir un second par-dessus.

   RIEN NE SE SUPERPOSE JAMAIS À LA MER NI À LA MAIN. */
// `tenir` : le texte reste jusqu'au prochain rendu au lieu de s'effacer au
// relâchement. Une carte en main se LIT TANT QU'ON LA TIENT — le doigt est
// déjà dessus, et la relâcher est le geste naturel pour en finir. Mais une
// pastille de météo ou un officier se TOUCHENT : garder le doigt dessus pour
// lire ne viendrait à l'idée de personne, et le texte n'aurait fait qu'un
// clignement.
function direDansLeTableau(html, { refus = false, tenir = false } = {}) {
  const d = document.querySelector('.ecran-cartes .tableau .tb-detail');
  if (!d) return;
  // On écrit EN PLACE, sans repasser par `rendre()` : un rendu complet pendant
  // que le doigt est posé détruirait la carte touchée sous ce même doigt.
  if (!tenir && d.dataset.avant == null) d.dataset.avant = d.innerHTML;
  d.innerHTML = html;
  d.classList.toggle('tb-dit-refus', refus);
}
function rendreLeTableau() {
  const d = document.querySelector('.ecran-cartes .tableau .tb-detail');
  if (!d || d.dataset.avant == null) return;
  d.innerHTML = d.dataset.avant;
  delete d.dataset.avant;
  d.classList.remove('tb-dit-refus');
}

// Ce qu'un homme fait, EN UNE LIGNE : son nom, son métier et son bord, son
// verbe. C'est tout ce dont on a besoin pour décider s'il entre dans la volée ;
// le reste — l'aide longue du métier — vit dans la modale d'aide, où on a le
// temps de le lire.
function aideDe(c) {
  if (C.estFeu(c)) {
    return '<b>Feu</b> · un incendie à bord · il occupe une place et ne tire pas ; '
      + 'seul un charpentier, envoyé seul, le jette par-dessus bord.';
  }
  const b = CONTENU.bords[c.bord];
  const r = CONTENU.roles[c.role];
  const etat = [c.blesse ? 'blessé −2' : null, c.grade ? `gradé ${'★'.repeat(c.grade)}` : null].filter(Boolean);
  return `<b>${c.nom}</b> · ${r.nom} ${b.nom}${etat.length ? ` (${etat.join(', ')})` : ''} · ${r.verbe}.`;
}

/* ---------------------------------------------------------------- la main */

// Le dedans d'une carte, écrit UNE fois : la main et la réserve montrent
// exactement le même objet, à l'échelle près. Deux gabarits qui divergent, ce
// serait deux cartes différentes pour le même homme.
// LE MÉTIER EST UN SYMBOLE, dessiné. Un boulet, une voile, deux haches, une
// planche : quatre formes qu'on distingue à distance de bras sans lire un mot,
// là où « canonnier » et « charpentier » commencent tous deux par un c.
// Dessiné en SVG et non en emoji : un emoji change de forme et de couleur
// d'un téléphone à l'autre, et arrive en couleurs qui ne sont pas les nôtres.
const GLYPHES = {
  // ● le boulet — un disque, l'ombre en creux.
  canonnier: '<circle cx="12" cy="12" r="8.2"/><circle cx="9.2" cy="9" r="2.4" fill="rgba(0,0,0,.28)"/>',
  // ▲ la voile — un triangle bordé, ventre au vent.
  gabier: '<path d="M12 3 L20 20 Q12 16.4 4 20 Z"/>',
  // ✕ deux haches croisées — les manches en X, les fers aux bouts hauts.
  abordeur: '<path d="M5.6 3.6 L20.4 19.6 M18.4 3.6 L3.6 19.6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/>'
    + '<path d="M4.4 2.2 Q9.4 2 9.2 7 Q6.4 5.4 3.2 6.6 Z"/><path d="M19.6 2.2 Q14.6 2 14.8 7 Q17.6 5.4 20.8 6.6 Z"/>',
  // ▬ la planche — un madrier, deux clous.
  charpentier: '<rect x="2.6" y="8.4" width="18.8" height="7.2" rx="1.2"/>'
    + '<circle cx="6.6" cy="12" r="1.05" fill="rgba(0,0,0,.32)"/><circle cx="17.4" cy="12" r="1.05" fill="rgba(0,0,0,.32)"/>',
};
function metierVu(role) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('fill', 'currentColor');
  svg.innerHTML = GLYPHES[role] || '<circle cx="12" cy="12" r="6"/>';
  return svg;
}

// Le dedans d'une carte, écrit UNE fois : la main et la réserve montrent
// exactement le même objet, à l'échelle près. Deux gabarits qui divergent, ce
// serait deux cartes différentes pour le même homme.
//
// LE BORD EST L'ENSEIGNE, comme la couleur d'une carte à jouer : c'est lui qui
// décide si deux hommes tirent ensemble, donc c'est lui qui porte le FOND de
// la carte entière. Le métier, lui, est le bandeau.
//
// Le bandeau était COLLÉ EN HAUT ou EN BAS selon que l'homme servait à l'avant
// ou à l'arrière. L'avant et l'arrière sont retirés : il n'y a plus qu'une
// position, en haut, et une chose de moins à décoder sur chaque carte.
function contenuCarte(c) {
  const feu = C.estFeu(c);
  const bandeau = el('span', { class: 'c-bandeau' }, [
    feu ? null : metierVu(c.role),
    el('span', { class: 'c-nom', text: feu ? 'Feu' : c.nom }),
  ]);
  return [
    c.blesse ? el('span', { class: 'c-etat', text: 'blessé' }) : null,
    feu ? el('span', { class: 'c-fumee' }) : null,
    bandeau,
    // LA VALEUR occupe le centre du champ libre : c'est le seul chiffre dont
    // le joueur a besoin pour composer une volée.
    el('span', { class: 'c-val', text: feu ? '—' : String(C.valeur(c, P)) }),
    // Le niveau ne s'affiche que s'il existe. « niv. 0 » sur douze cartes,
    // c'était douze fois la même information vide.
    !feu && c.grade ? el('span', { class: 'c-niveau', text: '★'.repeat(Math.min(c.grade, 5)) }) : null,
  ];
}

function carteVue(c, rang = 0, neuve = false) {
  const feu = C.estFeu(c);
  const pris = P.selection.includes(c);
  const b = feu ? null : CONTENU.bords[c.bord];
  const permis = C.peutJouer(P, c);
  const n = el('button', {
    class: `carte${pris ? ' prise-en-main' : ''}${feu ? ' feu' : ''}${c.blesse ? ' blesse' : ''}${!permis.ok && !pris ? ' muet' : ''}${neuve ? ' neuve' : ''}`,
    attrs: {
      type: 'button', 'aria-pressed': String(pris), style: `--rang:${rang}`,
      'data-bord': feu ? '' : c.bord, 'data-role': feu ? 'feu' : c.role,
      'aria-label': feu ? 'Feu — encombre la main'
        : `${c.nom}, ${c.role}, ${b.nom}, valeur ${C.valeur(c)}${permis.ok ? '' : `, ${permis.pourquoi}`}`,
    },
    on: {
      // Un retour SOUS LE DOIGT, avant même que l'état change : la carte
      // s'enfonce à l'appui et remonte au relâchement. C'est ce qui fait la
      // différence entre toucher un bouton et manipuler un objet.
      // TANT QUE LE DOIGT RESTE POSÉ, le tableau dit ce que fait cet homme-là.
      // Y compris ceux qu'on ne peut PAS jouer : ce sont eux dont il faut
      // expliquer le refus, et il s'écrit au même endroit, en rouge.
      pointerdown: () => {
        if (occupe) return;
        n.style.transform = 'translateY(-4px) scale(.97)';
        const permis = C.peutJouer(P, c);
        // Seul le REFUS passe en rouge : l'homme, lui, s'annonce comme les
        // autres. Toute la ligne en rouge disait « cet homme est mauvais »
        // plutôt que « ce coup-là est impossible ».
        direDansLeTableau(aideDe(c) + (permis.ok ? '' : `<br><span class="tb-refus">${permis.pourquoi}</span>`));
      },
      pointerup: () => { n.style.transform = ''; rendreLeTableau(); },
      pointerleave: () => { n.style.transform = ''; rendreLeTableau(); },
      pointercancel: () => { n.style.transform = ''; rendreLeTableau(); },
      click: () => {
        n.style.transform = '';
        if (occupe || glisse) return;
        const r = C.selectionner(P, c);
        if (!r.ok) { mot = `<span class="tb-refus">${r.pourquoi}</span>`; secouer(n); }
        rendre();
      },
    },
  }, contenuCarte(c));
  // La classe s'enlève dès que l'animation est finie : un marqueur qui reste
  // après coup est un état qui ment, et le jour où quelque chose le relit,
  // l'animation repart.
  if (neuve) n.addEventListener('animationend', () => n.classList.remove('neuve'), { once: true });
  return n;
}
function secouer(n) {
  n.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 190 });
}

// L'ÉTAT-MAJOR : les officiers sont les jokers de la chasse-partie. Ils ne se
// jouent pas, ils sont là et ils changent une règle — donc ils doivent être
// visibles en permanence, et s'expliquer au doigt.
function etatMajor() {
  // Seuls les officiers EMBARQUÉS s'affichent : trois carrés vides en
  // permanence, c'était trois cibles tactiles pour rien — et sous les 44 px,
  // parce qu'il fallait les faire tenir. À bord, ils prennent la place qu'il
  // faut pour qu'un pouce les trouve.
  if (!P.officiers.length) return null;
  const zone = el('div', { class: 'etat-major' });
  for (const id of P.officiers) {
    const o = CONTENU.officiers.find((x) => x.id === id);
    if (!o) continue;
    const n = el('button', {
      class: 'officier', text: o.nom.replace(/^(Le |La |L')/, '')[0],
      attrs: { type: 'button', 'aria-label': `${o.nom} — ${o.texte}` },
      on: { click: () => direDansLeTableau(`<b>${o.nom}</b>, ${o.titre} · ${o.texte}`, { tenir: true }) },
    });
    zone.appendChild(n);
  }
  return zone;
}

/* ---------------------------------------------------------------- l'écran */
function ecranChasse() {
  const p = P.prise;
  const s = el('div', { class: 'screen ecran-cartes' });

  s.appendChild(el('div', { class: 'ruban' }, [
    el('div', { class: 'rb-txt' }, [
      el('div', { class: 'rb-quoi', text: `Prendre ${p.nom}` }),
      el('div', { class: 'rb-rang', text: p.rang }),
    ]),
    // LES DEUX COMPTEURS DE LA RENCONTRE, à gauche du butin. Ce sont eux la
    // ressource : quatre bordées à tirer, trois rechargements à dépenser.
    el('div', { class: 'rb-coups' }, [
      el('span', { class: `rb-coup${P.bordees <= 1 ? ' bas' : ''}`, text: `⚔ ${P.bordees}` }),
      el('span', { class: `rb-coup${P.rechargements <= 0 ? ' vide' : ''}`, text: `↻ ${P.rechargements}` }),
    ]),
    el('div', { class: 'rb-butin', text: `${P.butin} 💰` }),
    el('button', { class: 'btn-level-3 rouage', text: '⚙', attrs: { type: 'button', 'aria-label': 'aide et réglages' }, on: { click: ouvrirAide } }),
  ]));

  // Les deux plaques sont dans UNE rangée en haut de la bande : posées
  // au-dessus de chaque coque, elles se retrouvaient à deux hauteurs
  // différentes selon la taille des navires, et l'œil lisait deux mers.
  const mer = el('div', { class: 'mer' }, [
    el('div', { class: 'etiquettes' }, [
      // LA TORTUE N'A PLUS DE JAUGE : elle n'a plus de points de vie, on ne
      // peut plus couler. Sa plaque dit ce qui nous reste à dépenser — c'est
      // la seule chose de notre côté qui puisse manquer.
      el('div', { class: 'etiq nous' }, [
        el('div', { class: 'e-nom', text: 'La Tortue' }),
        el('div', { class: 'e-chif' }, [
          el('span', { class: 'e-fort', text: `${P.bordees} bordée${P.bordees > 1 ? 's' : ''}` }),
          el('span', { class: 'e-mats', text: `main ${P.main.length}/${C.tailleMain(P)}` }),
        ]),
      ]),
      // LA JAUGE DE PRESSION SE REMPLIT VERS LA RÉSISTANCE : c'est la barre
      // que le joueur regarde, et le seul compteur qui décide de la fin. La
      // coque passe en seconde ligne, plus fine — elle ne dit plus que le
      // risque de l'envoyer par le fond avant qu'elle ait amené son pavillon.
      el('div', { class: 'etiq prise' }, [
        el('div', { class: 'e-nom', text: p.nom }),
        el('div', { class: 'jauge pression' }, [el('i', { attrs: { style: `width:${Math.min(100, (100 * P.pression) / p.resistance)}%` } })]),
        el('div', { class: 'e-chif' }, [
          el('span', { class: 'e-fort', text: `${P.pression} / ${p.resistance}` }),
        ]),
        el('div', { class: 'jauge bordage' }, [el('i', { attrs: { style: `width:${(100 * p.pv) / p.max}%` } })]),
        el('div', { class: 'e-chif menu' }, [el('span', { text: `coque ${p.pv} / ${p.max}` })]),
      ]),
    ]),
    el('div', { class: 'flotte' }, [
      el('div', { class: 'coque nous' }, [el('canvas', { attrs: { id: 'c-nous' } })]),
      el('div', { class: 'coque prise' }, [el('canvas', { attrs: { id: 'c-prise' } })]),
    ]),
  ]);
  // LES CONDITIONS : météo, règle de la prise, reliques. Une seule cible de
  // 44 px qui les ouvre toutes — trois puces de 17 px de haut étaient trois
  // cibles qu'un pouce rate, et l'audit mobile les relevait.
  const conditions = [];
  // LA MÉTÉO EST DU DÉCOR. Elle multipliait chaque volée, si bien qu'une même
  // main valait deux chiffres différents selon le ciel et qu'il fallait le lire
  // avant de compter. Elle reste le ciel, la houle et la pluie, et elle le dit.
  if (P.meteo) {
    conditions.push({
      chip: `${P.meteo.icon} ${P.meteo.name_fr}`, cls: '',
      titre: `${P.meteo.icon} ${P.meteo.name_fr}`,
      corps: `${P.meteo.desc_fr || ''} <b>Aucun effet sur tes volées</b> — le temps qu'il fait ne change pas ce que valent tes hommes.`,
    });
  }
  for (const id of P.reliques) {
    const r = CONTENU.reliques.find((x) => x.id === id);
    if (r) conditions.push({ chip: `✦ ${r.nom}`, cls: 'relique', titre: `✦ ${r.nom}`, corps: r.texte });
  }
  const past = el('button', {
    class: 'pastilles', attrs: { type: 'button', 'aria-label': 'conditions de la chasse' },
    on: { click: () => direDansLeTableau(conditions.map((c) => `<b>${c.titre}</b> — ${c.corps}`).join(' '), { tenir: true }) },
  }, conditions.map((c) => el('span', { class: `pastille ${c.cls}`, text: c.chip })));
  if (conditions.length) mer.appendChild(past);

  const major = etatMajor();
  if (major) mer.appendChild(major);

  // SA CARTE : l'intention n'est pas un bandeau de plus en travers de l'écran,
  // c'est une carte — même facture que les nôtres, teinte sombre — posée sous
  // SON navire. Elle appartient visuellement à la prise, et le joueur n'a
  // qu'un seul vocabulaire de forme à apprendre.
  // Sa carte ne porte plus de chiffre de dégâts : elle ne touche plus notre
  // coque, elle touche notre MAIN. Ce qu'elle prend s'écrit en toutes lettres.
  const a = p.annonce;
  const chiffre = '⚑';
  const saCarte = el('div', {
    class: `sa-carte${p.tirAnnule ? ' annulee' : ''}`,
    attrs: { role: 'button', tabindex: '0', 'aria-label': `${a.nom} — ${a.texte}` },
    on: { click: () => direDansLeTableau(`<b>${a.nom}</b> — ${p.tirAnnule
      ? `les gabiers ont coupé sa manœuvre : ${p.nom} ne fera rien ce tour-ci.`
      : `${a.texte} ${p.nom} la joue à la fin de ton tour, pas avant.`}`, { tenir: true }) },
  }, [
    el('div', { class: 'sa-tete' }, [el('span', { text: p.tirAnnule ? 'coupée' : 'sa carte' })]),
    el('div', { class: 'sa-nom', text: a.nom }),
    el('div', { class: 'sa-mesure', text: p.tirAnnule ? '✕' : chiffre }),
    el('div', { class: 'sa-pied', text: p.tirAnnule ? 'sans effet' : 'fin du tour' }),
    // LE PILOTE MONTRE LA CARTE D'APRÈS, en pied de la sienne : c'est de
    // l'information pure, et c'est tout ce qu'il vend.
    p.suivante ? el('div', { class: 'sa-suite', text: `puis ${p.suivante.nom}` }) : null,
  ]);
  mer.appendChild(saCarte);

  // La zone de dépôt vit SOUS NOTRE NAVIRE : c'est là que la volée doit
  // arriver. Elle n'apparaît que pendant le geste — une cible permanente
  // serait un bouton de plus, et il n'y en a aucun.
  mer.appendChild(el('div', { class: 'depot' }, [el('span', { text: '⌃ la volée part ici' })]));
  s.appendChild(mer);

  s.appendChild(tableau());

  const main = el('div', { class: 'main' });
  P.main.forEach((c, i) => main.appendChild(carteVue(c, neuves.indexOf(c.uid), neuves.includes(c.uid))));

  // LA COMPOSITION DE LA PIOCHE, jamais son ordre. Ce qu'un joueur a le droit
  // de savoir, c'est ce qui lui reste — pas ce qui vient. (Les deux hommes de
  // la relève, eux, sont montrés à part : c'est une fenêtre voulue.)
  const reste = P.pioche;
  const parBord = { babord: 0, tribord: 0 };
  const parRole = {};
  for (const c of reste) {
    if (C.estFeu(c)) { parRole.feu = (parRole.feu || 0) + 1; continue; }
    parBord[c.bord] += 1;
    parRole[c.role] = (parRole[c.role] || 0) + 1;
  }
  const roles = Object.entries(parRole)
    .sort((a, b) => b[1] - a[1])
    .map(([r, n]) => `${r === 'feu' ? 'feu' : CONTENU.roles[r].court} ${n}`)
    .join(', ');
  const piocheEtat = el('div', { class: 'pioche-etat', attrs: { 'aria-hidden': 'true' } }, [
    el('span', { class: 'pe-cle', text: 'pioche' }),
    el('span', { class: 'pe-nb', text: String(reste.length) }),
    el('span', { class: 'pe-bord' }, [
      el('i', { class: 'pt-ba' }), el('span', { text: String(parBord.babord) }),
      el('i', { class: 'pt-tri' }), el('span', { text: String(parBord.tribord) }),
    ]),
    el('span', { class: 'pe-roles', text: roles || '—' }),
  ]);

  // LES DEUX QUI VIENNENT, POSÉS SUR LE LISTEAU. Face visible, enfoncés dans
  // le bois. On pioche avec `pop()` : le
  // DESSUS du paquet est la fin du tableau, donc le premier à venir est le
  // dernier élément.
  //
  // Ce n'est pas une cible : on ne peut ni les toucher ni les jouer. Savoir
  // qui vient ensuite change ce qu'on garde en main ce tour-ci, et c'est tout
  // ce qu'on leur demande.
  const aVenir = P.pioche.slice(-2).reverse();
  const reserve = el('div', { class: 'reserve', attrs: { 'aria-hidden': 'true' } },
    [el('span', { class: 'reserve-cle', text: 'à venir' })].concat(aVenir.map((c, i) => el('div', {
      class: `carte mini${C.estFeu(c) ? ' feu' : ''}${c.blesse ? ' blesse' : ''}`,
      attrs: {
        style: `--rang:${i}`,
        'data-bord': C.estFeu(c) ? '' : c.bord,
        'data-role': C.estFeu(c) ? 'feu' : c.role,
      },
    }, contenuCarte(c)))));
  s.appendChild(el('div', { class: 'ratelier' }, [piocheEtat, reserve, main]));
  return s;
}

/* ----------------------------------------------------------- le geste
   UN seul ordre, UNE seule cible. On touche pour choisir ses hommes, on les
   pousse vers la zone de dépôt qui s'ouvre sous notre navire, et la volée
   part. Redescendre avant de lâcher défait la volée.

   ET VERS LE BAS : LE RECHARGEMENT, en miroir exact. On tire la volée vers le
   bas et ces hommes-là repartent au fond du paquet ; on en reprend autant, et
   la prise ne riposte pas. Pas de seconde zone de dépôt pour autant — le
   râtelier lui-même est la cible, parce qu'il n'y a pas de place sous les
   cartes pour en poser une, et deux zones sur la largeur d'un pouce se
   rateraient l'une l'autre. Le geste descendant RÉSISTE (44 px, la même mesure
   que la cible tactile minimale) : un rechargement coûte une ressource et ne
   doit pas arriver en reposant le pouce.

   Dès le début du glissement les cartes SE REGROUPENT en paquet et se
   redressent : on voit partir une volée, pas trois cartes qui montent en
   parallèle. */
let glisse = false;

function brancherGeste(scene) {
  const ratelier = scene.querySelector('.ratelier');
  const tab = scene.querySelector('.tableau');
  const depot = scene.querySelector('.depot');
  const zones = [ratelier, tab].filter(Boolean);
  const aide = scene.querySelector('.tb-geste');
  const aideTexte = aide ? aide.innerHTML : '';
  let y0 = null, x0 = 0, dy = 0, dx = 0, montee = 0, franchi = false;
  let paquet = [];   // les cartes levées ET LEURS BOÎTES DE DÉPART

  const dire = (h, cls) => {
    if (tab) { tab.classList.remove('tire', 'annule'); if (cls) tab.classList.add(cls); }
    if (aide) aide.innerHTML = h;
  };
  const surLeDepot = (x, y) => {
    if (!depot) return false;
    const r = depot.getBoundingClientRect();
    const m = 26;   // le doigt cache la cible : on l'élargit
    return x >= r.left - m && x <= r.right + m && y >= r.top - m && y <= r.bottom + m;
  };

  const debut = (e) => {
    if (occupe || P.fini || !P.selection.length) return;
    y0 = e.clientY; x0 = e.clientX; dy = 0; dx = 0; montee = 0; franchi = false;
    paquet = [];
  };
  const bouge = (e) => {
    if (y0 === null) return;
    dy = e.clientY - y0; dx = e.clientX - x0;
    montee = Math.min(montee, dy);
    if (!franchi && Math.hypot(dx, dy) > 8) {
      franchi = true; glisse = true;
      // LE GESTE COMMENCE ICI, pas au `pointerdown`. Le doigt quitte la carte
      // qu'il tenait : le tableau reprend son contenu. Restauré dès l'appui —
      // le `pointerdown` de la carte remonte jusqu'au râtelier — il effaçait la
      // phrase de l'homme touché avant même qu'on l'ait lue.
      rendreLeTableau();
      // PAS de capture avant ce point : capturer dès l'appui redirige le
      // `click` suivant vers la zone au lieu de la carte, et plus aucun homme
      // ne peut être ajouté à la volée.
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch { /* souris relâchée */ }
      // LES BOÎTES SONT MESURÉES UNE FOIS. Les relire à chaque `pointermove`
      // les lisait DÉJÀ TRANSFORMÉES : la position calculée dépendait de la
      // précédente, et le paquet tremblait. Une boucle de rétroaction, la même
      // que celle qui rétrécissait les coques.
      paquet = [...scene.querySelectorAll('.carte.prise-en-main')].map((n) => {
        const r = n.getBoundingClientRect();
        n.style.transition = 'none';
        return { n, cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
      });
      // La zone de dépôt n'existe que pour le geste QUI MONTE. Ouverte dès le
      // franchissement du seuil, elle s'affichait aussi pendant qu'on tirait
      // la volée vers le bas — et proposait le contraire de ce qu'on faisait.
    }
    if (!franchi) return;

    // Les cartes SUIVENT LE DOIGT, sans plafond : elles doivent pouvoir se
    // poser sur la zone de dépôt. Bornées, elles restaient collées en bas de
    // l'écran et le geste n'aboutissait jamais.
    const cx = paquet.length ? paquet.reduce((s, p) => s + p.cx, 0) / paquet.length : 0;
    const k = Math.max(0, Math.min(1, -dy / 90));      // 0 → posées, 1 → en paquet
    paquet.forEach((p, i) => {
      const vers = (cx - p.cx) * k + (i - (paquet.length - 1) / 2) * 5 * k;
      const tourne = (i - (paquet.length - 1) / 2) * 3.5 * k;
      p.n.style.transform = `translate(${dx + vers}px, ${dy - 18}px) rotate(${tourne}deg) scale(${1.04 + k * 0.05})`;
      p.n.style.zIndex = String(20 + i);
    });

    // On n'est jamais monté et on descend franchement : c'est un rechargement.
    const recharge = montee > -40 && dy > 44;
    if (depot) depot.classList.toggle('vu', !recharge && dy < 0);
    const pret = !recharge && surLeDepot(e.clientX, e.clientY);
    if (depot) depot.classList.toggle('prete', pret);
    if (ratelier) ratelier.classList.toggle('recharge', recharge && P.rechargements > 0);
    const annule = montee < -40 && dy > montee + 60;
    if (recharge) {
      const n = P.selection.length;
      dire(P.rechargements > 0
        ? `↓ relâche : ${n} homme${n > 1 ? 's repartent' : ' repart'} au fond, ${P.rechargements - 1} rechargement${P.rechargements - 1 > 1 ? 's' : ''} après`
        : '<span class="tb-refus">plus un rechargement à dépenser</span>', 'tire');
    } else if (annule) dire('↩ relâche : la volée est défaite', 'annule');
    else if (pret) dire('↑ relâche : la volée part', 'tire');
    else dire('vers le haut : la volée part · vers le bas : on recharge', null);
  };
  const fin = (e) => {
    if (y0 === null) return;
    const surZone = e && e.clientX != null ? surLeDepot(e.clientX, e.clientY) : false;
    const m = montee, d = dy, bougea = franchi;
    y0 = null; franchi = false;
    for (const p of paquet) { p.n.style.transition = ''; p.n.style.transform = ''; p.n.style.zIndex = ''; }
    paquet = [];
    if (depot) depot.classList.remove('vu', 'prete');
    if (ratelier) ratelier.classList.remove('recharge');
    setTimeout(() => { glisse = false; }, 60);
    if (!bougea) { dire(aideTexte, null); return; }
    if (m > -40 && d > 44) { rechargerVolee(); return; }
    if (surZone) { tirer(); return; }
    // Monté puis redescendu : on renonce.
    if (m < -40 && d > m + 60) { P.selection = []; mot = 'Volée défaite.'; rendre(); return; }
    dire(aideTexte, null);
  };

  for (const z of zones) {
    z.addEventListener('pointerdown', debut);
    z.addEventListener('pointermove', bouge);
    z.addEventListener('pointerup', fin);
    z.addEventListener('pointercancel', fin);
  }
  // Clavier : le geste raccourcit un ordre, il ne doit pas être le seul chemin.
  scene.tabIndex = -1;
  scene.addEventListener('keydown', (e) => {
    if (occupe || !P.selection.length) return;
    if (e.key === 'ArrowUp' || e.key === 'Enter') { e.preventDefault(); tirer(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); rechargerVolee(); }
    if (e.key === 'Escape') { e.preventDefault(); P.selection = []; rendre(); }
  });
}

/* ------------------------------------------------------------ le tour */
// LE RECHARGEMENT : les hommes sélectionnés repartent au fond, on en reprend
// autant, la prise ne riposte pas. Aucune bordée n'est dépensée — c'est le
// second compteur du ruban qui paie.
function rechargerVolee() {
  if (occupe || P.fini || !P.selection.length) return;
  const combien = P.selection.length;
  const avant = new Set(P.main.map((c) => c.uid));
  const r = C.recharger(P, rng);
  if (!r.ok) { mot = `<span class="tb-refus">${r.pourquoi}</span>`; rendre(); return; }
  // Les hommes repris arrivent comme à la distribution : on les VOIT monter.
  neuves = P.main.filter((c) => !avant.has(c.uid)).map((c) => c.uid);
  mot = `${combien} homme${combien > 1 ? 's renvoyés' : ' renvoyé'} au fond — il reste ${P.rechargements} rechargement${P.rechargements > 1 ? 's' : ''}.`;
  rendre();
}

async function tirer() {
  if (occupe || P.fini || !P.selection.length) return;
  occupe = true;
  const r = C.jouer(P);
  rendre();

  // 1. NOTRE tir.
  if (r.cible === 'radoub') {
    fxFloatText(centre('c-nous').x, centre('c-nous').y - 20, '+12', 'heal');
    await attendre(500);
  } else {
    await tir('c-nous', 'c-prise', 1,
      `−${r.degats}`, 'dmg', { cible: r.cible });
    if (r.pression > 0) fxFloatText(centre('c-prise', 0.5, 0.82).x, centre('c-prise', 0.5, 0.82).y, `+${r.pression} ⚑`, '');
  }
  peindreCoques();
  rendre();

  if (P.fini) { occupe = false; finPrise(); return; }

  // 2. PUIS la sienne — jamais les deux en même temps.
  await attendre(180);
  const rip = C.riposter(P);
  if (rip.annulee) {
    fxFloatText(centre('c-prise').x, centre('c-prise').y - 24, 'carte coupée', '');
    await attendre(560);
  } else if (rip.degats > 0) {
    await tir('c-prise', 'c-nous', -1, `−${rip.degats}`, 'dmg');
  } else if (rip.effets.length) {
    // Un effet qui n'atterrit nulle part n'existe pas pour le joueur : le
    // brûlot et la mitraille frappent NOTRE bord, donc le texte monte de
    // NOTRE navire, après un boulet parti du sien.
    const cvN = document.getElementById('c-nous');
    const rN = cvN ? cvN.getBoundingClientRect() : null;
    const echN = cvN && rN ? rN.height / cvN.height : 1;
    const a = bouches('c-prise', -1);
    const b = rN
      ? { x: rN.left + rN.width * 0.5,
        y: rN.top + Number(cvN.dataset.pont || 0) * echN
          + (Number(cvN.dataset.flottaison || cvN.height) - Number(cvN.dataset.pont || 0)) * echN * 0.5 }
      : centre('c-nous', 0.5, 0.45);
    bouffee(a, -1, 0.9);
    await attendre(120);
    await boulet(a[0], b, 520);
    impact(b, 'coque');
    fxFloatText(b.x, b.y - 26, rip.intention.nom, 'dmg');
    await attendre(620);
  }
  mot = [rip.annulee ? rip.raison : null, ...rip.effets].filter(Boolean).join(' ');
  peindreCoques();
  occupe = false;
  // On ne coule plus : `naufrage` n'existe plus comme fin. La seule façon de
  // perdre est de manquer le seuil, et c'est la riposte qui la constate.
  // La riposte peut clore la rencontre elle aussi : plus une bordée à tirer et
  // la prise force de voiles. Sans ce second passage, la manche restait ouverte
  // sur un écran où plus rien n'était jouable.
  if (P.fini) { finPrise(); return; }
  relever();
  rendre();
  ecranCourant()?.focus?.();
}
function finPrise() { ecran = 'partage'; phylactere('denouement', [P.meteo && P.meteo.id, P.prise.id].filter(Boolean)); lotPour = -1; rendre(); }
// `scene` est déjà pris par src/ocean.js : dans le fichier autonome les
// modules partagent une portée, et le doublon rendait la page blanche.
const ecranCourant = () => document.querySelector('.screen.ecran-cartes');

/* ------------------------------------------------------------- le partage */
let lot = null, lotPour = -1;
function offres() {
  if (lotPour !== P.prisesFaites) {
    lotPour = P.prisesFaites;
    const dispo = CONTENU.recrues.filter((r) => !P.equipage.some((c) => c.id === r.id));
    const rel = CONTENU.reliques.filter((r) => !P.reliques.includes(r.id));
    lot = [
      ...C.melanger(dispo, rng).slice(0, 2).map((r) => ({
        nom: `Recruter ${r.nom}`, prix: r.prix,
        det: `${r.role} · ${CONTENU.bords[r.bord].nom} · valeur ${r.valeur}`,
        acheter: () => C.recruter(P, r),
      })),
      ...C.melanger(rel, rng).slice(0, 1).map((r) => ({ nom: r.nom, prix: r.prix, det: r.texte, acheter: () => C.acheterRelique(P, r) })),
      ...C.melanger(CONTENU.officiers.filter((o) => !P.officiers.includes(o.id)), rng).slice(0, 2).map((o) => ({
        nom: `${o.nom}`, prix: o.prix, det: `officier · ${o.titre} — ${o.texte}`,
        acheter: () => C.engagerOfficier(P, o),
      })),
    ];
    const promu = C.melanger(P.equipage.filter((c) => c.grade < 3 && c.role !== 'charpentier'), rng)[0];
    if (promu) lot.push({ nom: `Passer ${promu.nom} gradé`, prix: 4, det: `${promu.role} · valeur ${C.valeur(promu)} → ${C.valeur(promu) + 1}`, acheter: () => C.graduer(P, promu) });
  }
  return lot;
}
function ecranPartage() {
  const s = el('div', { class: 'screen ecran-cartes' });
  s.appendChild(el('div', { class: 'ruban' }, [
    el('div', { class: 'rb-txt' }, [
      el('div', { class: 'rb-quoi', text: P.fini === 'echec' ? 'Rien à partager' : 'Partage du butin' }),
      el('div', { class: 'rb-rang', text: `${P.prisesFaites} prise(s) · on relâche` }),
    ]),
    el('div', { class: 'rb-butin', text: `${P.butin} 💰` }),
  ]));
  // LES TROIS DÉNOUEMENTS SE DISENT, et se disent DIFFÉREMMENT. « La prise est
  // à nous » sur une prise échappée était un mensonge que le compteur de butin
  // démentait deux lignes plus bas.
  const p = P.prise || {};
  const VERDICTS = {
    prise: {
      titre: p.abordee ? 'Prise à l’abordage' : 'Elle amène son pavillon',
      dit: `${p.nom} se rend entière : ${p.butin || 0} 💰`
        + (p.prime ? `, et ${p.prime} 💰 de prime pour l’avoir prise sans la couler.` : '.'),
    },
    coulee: {
      titre: 'Coulée',
      dit: `${p.nom} s’enfonce avant d’avoir amené : on ne repêche que ${p.gagne || 0} 💰 sur ${p.butin || 0}.`,
    },
    echec: {
      titre: 'Elle s’échappe',
      dit: `Quatre bordées et ${p.nom} tient encore : elle force de voiles et l’on n’a rien.`,
    },
  };
  const v = VERDICTS[P.fini] || VERDICTS.prise;
  s.appendChild(el('div', { class: `verdict${P.fini === 'echec' ? ' rate' : ''}` }, [
    el('h2', { text: v.titre }),
    el('p', { html: v.dit }),
    el('p', { class: 'v-suite', html: mot || 'On radoube, on recrute, et on repart. Ce qui n’est pas acheté maintenant est perdu.' }),
  ]));
  const liste = el('div', { class: 'partage' });
  for (const o of offres()) {
    const cher = o.prix > P.butin;
    liste.appendChild(el('button', {
      class: 'offre', attrs: { type: 'button', ...(cher ? { disabled: '' } : {}) },
      on: { click: () => { const r = o.acheter(); if (r.ok) rendre(); else mot = r.pourquoi; } },
    }, [
      el('div', { class: 'o-txt' }, [el('div', { class: 'o-nom', text: o.nom }), el('div', { class: 'o-det', text: o.det })]),
      el('div', { class: 'o-prix', text: `${o.prix} 💰` }),
    ]));
  }
  s.appendChild(liste);
  s.appendChild(el('div', { class: 'suite' }, [
    el('button', { class: 'btn-level-1', text: 'Reprendre la mer', attrs: { type: 'button' }, on: { click: retourAuJeu } }),
  ]));
  return s;
}
// LA CARTE : la même mer à chaque partie, abordée par le même coin. Ce qu'on
// apprend d'une partie à l'autre, c'est cette mer-là — pas une suite de nœuds.
function ecranCarte() {
  const s = el('div', { class: 'screen ecran-cartes' });
  const ouvertes = Voy.escales(V);
  const h = Voy.ici(V);
  const vise = viseeCarte && ouvertes.some((o) => o.id === viseeCarte) ? viseeCarte : null;

  s.appendChild(el('div', { class: 'ruban' }, [
    el('div', { class: 'rb-txt' }, [
      el('div', { class: 'rb-quoi', text: 'Mettre le cap' }),
      el('div', { class: 'rb-rang', text: `acte ${V.acte} · ${V.etapes} traversée${V.etapes > 1 ? 's' : ''} · ${P.prisesFaites} prise${P.prisesFaites > 1 ? 's' : ''}` }),
    ]),
    el('div', { class: 'rb-butin', text: `${P.butin} 💰` }),
    el('button', { class: 'btn-level-3 rouage', text: '⚙', attrs: { type: 'button', 'aria-label': 'aide' }, on: { click: ouvrirAide } }),
  ]));

  // LA CARTE SE RECADRE SUR CE QUI EST EN JEU. À l'acte 1, tout se passe dans
  // un coin d'Hispaniola : à l'échelle des Caraïbes entières, c'était quatre
  // points superposés dans 5 % de l'image et 95 % d'eau vide. On cadre sur là
  // où l'on est, là où l'on peut aller et là où l'on est passé, avec une marge.
  const enJeu = [h, ...ouvertes, ...V.visites.map((id) => places().find((p) => p.id === id)).filter(Boolean)];
  const marge = 0.09;
  const bx0 = Math.max(0, Math.min(...enJeu.map((p) => p.x)) - marge);
  const bx1 = Math.min(1, Math.max(...enJeu.map((p) => p.x)) + marge);
  const by0 = Math.max(0, Math.min(...enJeu.map((p) => p.y)) - marge);
  const by1 = Math.min(1, Math.max(...enJeu.map((p) => p.y)) + marge);
  const cadre = (p) => ({ x: (p.x - bx0) / (bx1 - bx0), y: (p.y - by0) / (by1 - by0) });

  const chart = el('div', { class: 'chart' });
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `${bx0 * 100} ${by0 * 100} ${(bx1 - bx0) * 100} ${(by1 - by0) * 100}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  // La terre d'abord : sans elle, la carte est une poignée de points sur du
  // bleu, et l'on ne voit pas que la Tortue est bien tapie derrière Hispaniola.
  for (const cote of coastlines()) {
    const path = document.createElementNS(NS, 'path');
    const d = cote.points.map((pt, i) => `${i ? 'L' : 'M'}${(pt.x * 100).toFixed(2)},${(pt.y * 100).toFixed(2)}`).join(' ');
    path.setAttribute('d', d + (cote.closed ? ' Z' : ''));
    path.setAttribute('class', cote.closed ? 'terre' : 'cote');
    svg.appendChild(path);
  }
  // Les routes CONTOURNENT LA TERRE. Un trait droit passait au travers
  // d'Hispaniola : une carte fausse n'apprend pas la mer qu'elle prétend
  // apprendre.
  for (const e of ouvertes) {
    const pts = routeEntre(h, e);
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', pts.map((p, i) => `${i ? 'L' : 'M'}${(p.x * 100).toFixed(2)},${(p.y * 100).toFixed(2)}`).join(' '));
    path.setAttribute('class', `route${e.id === vise ? ' visee' : ''}`);
    path.dataset.vers = e.id;
    svg.appendChild(path);
  }
  chart.appendChild(svg);

  // LE CAP SE VALIDE PAR UN BOUTON. « Touche encore pour confirmer » n'était
  // écrit nulle part avant d'avoir visé, et rien à l'écran ne le laissait
  // deviner : le joueur touchait une escale, lisait ce qu'elle était, et
  // restait là. Viser reste sans engagement ; partir est un ordre nommé.
  const choisie = vise ? ouvertes.find((o) => o.id === vise) : null;
  const esc = choisie ? (Voy.ESCALES[choisie.type] || Voy.ESCALES.chasse) : null;
  const cap = el('div', { class: 'cap' }, [
    el('div', { class: 'c-ou', text: choisie ? `${choisie.name} — ${esc.nom}` : h.name }),
    el('div', {
      class: 'c-quoi',
      html: choisie ? `${choisie.note}<br><b>${esc.quoi}</b>`
        : `${h.note}<br>Touche une escale pour savoir ce qu’on y trouve.`,
    }),
    choisie
      ? el('button', {
        class: 'btn-level-1 partir', text: `Mettre le cap sur ${choisie.name}`,
        attrs: { type: 'button' }, on: { click: () => { viseeCarte = null; aborder(choisie); } },
      })
      : null,
  ]);

  for (const place of places()) {
    const ouverte = ouvertes.some((o) => o.id === place.id);
    const estIci = place.id === V.lieu;
    const vu = V.visites.includes(place.id);
    const q = cadre(place);
    if (q.x < -0.06 || q.x > 1.06 || q.y < -0.06 || q.y > 1.06) continue;   // hors cadre
    const n = el('button', {
      class: `epingle lbl-${place.label || 's'}${ouverte ? ' ouverte' : ''}${estIci ? ' ici' : ''}${vu ? ' vu' : ''}${place.id === vise ? ' visee' : ''}`,
      attrs: {
        type: 'button', style: `left:${q.x * 100}%; top:${q.y * 100}%`,
        'aria-label': `${place.name} — ${place.note}`, ...(ouverte ? {} : { disabled: '' }),
      },
      // Toucher une escale VISE, et rien de plus : le bouton du bas est le
      // seul ordre. Première touche = viser, seconde = confirmer, c'est la
      // règle de tout l'écran (§2).
      on: { click: () => { if (ouverte) { viseeCarte = place.id; rendre(); } } },
    }, [
      el('span', { class: 'pt' }),
      // Seuls le lieu où l'on est et celui qu'on vise portent leur nom :
      // quatre escales voisines nommées d'un coup, dans un coin d'Hispaniola,
      // c'était quatre étiquettes l'une par-dessus l'autre.
      (estIci || place.id === vise) ? el('span', { class: 'nom', text: place.name }) : null,
    ]);
    chart.appendChild(n);
  }

  s.appendChild(chart);
  s.appendChild(cap);
  return s;
}

function ecranEpave() {
  const s = el('div', { class: 'screen ecran-cartes' });
  s.appendChild(el('div', { class: 'verdict' }, [
    el('h2', { text: 'Une épave' }),
    el('p', { html: trouve
      ? `Dans ce qui reste de la cale : <b>${trouve.def.nom}</b>.<br>${trouve.def.texte || trouve.def.titre}`
      : 'La mer a déjà tout pris. Il n’en reste rien.' }),
  ]));
  s.appendChild(el('div', { class: 'suite' }, [
    el('button', { class: 'btn-level-1', text: 'Reprendre la mer', attrs: { type: 'button' },
      on: { click: () => { trouve = null; retourAuJeu(); } } }),
  ]));
  return s;
}

function ecranRencontre() {
  const s = el('div', { class: 'screen ecran-cartes' });
  s.appendChild(el('div', { class: 'verdict' }, [
    el('h2', { text: rencontre.titre }),
    el('p', { text: rencontre.texte }),
  ]));
  // Sa propre classe, pas celle du partage : deux écrans qui se ressemblent
  // au point qu'un test automatique les confond se ressemblent trop.
  const liste = el('div', { class: 'branches' });
  for (const b of rencontre.branches) {
    liste.appendChild(el('button', {
      class: 'offre', attrs: { type: 'button' },
      on: { click: () => { appliquer(b); rencontre = null; retourAuJeu(); } },
    }, [
      el('div', { class: 'o-txt' }, [
        el('div', { class: 'o-nom', text: b.texte }),
        el('div', { class: 'o-det', text: b.dit }),
      ]),
    ]));
  }
  s.appendChild(liste);
  return s;
}

function appliquer(b) {
  switch (b.gain) {
    case 'recrue': {
      const libres = CONTENU.recrues.filter((r) => !P.equipage.some((c) => c.id === r.id));
      if (libres.length) { P.butin += libres[0].prix; C.recruter(P, libres[0]); mot = `${libres[0].nom} embarque.`; }
      break;
    }
    // La Tortue n'a plus de points de vie : ce qui la soignait donne du butin.
    case 'soin': P.butin += 4; mot = 'On revend ce qu’on n’emporte pas : +4 💰.'; break;
    case 'soin_plein': P.butin += 8; mot = 'La cale est vidée au meilleur prix : +8 💰.'; break;
    case 'butin': P.butin += 6; mot = '+6 de butin.'; break;
    case 'carte_marine': P.butin = Math.max(0, P.butin - 4); mot = 'On sait où elle passe.'; break;
    default: mot = '';
  }
}

// L'ÉCRAN DE NAUFRAGE EST RETIRÉ. La Tortue n'a plus de points de vie : on ne
// perd plus en coulant, on perd en manquant le seuil — et cette fin-là se dit
// sur l'écran de partage, avec les deux autres.

/* ---------------------------------------------------------------- l'aide */
// Une seule fois, au premier engagement : ce qu'est une volée, et le geste.
// Trois phrases sur un fond opaque, refermées d'un doigt — pas un tutoriel.
const CLE_OUVERTURE = 'fdlc-cartes-ouverture-vue';
let vuLOuverture = false;
function motPremier() {
  if (vuLOuverture) return;
  vuLOuverture = true;
  try { if (localStorage.getItem(CLE_OUVERTURE)) return; localStorage.setItem(CLE_OUVERTURE, '1'); } catch { /* mode privé */ }
  if (new URLSearchParams(location.search).has('sansOuverture')) return;
  const fond = el('div', { class: 'overlay', on: { click: () => fond.remove() } });
  fond.appendChild(el('div', { class: 'modal ecran-cartes aide-boite' }, [
    el('h3', { text: 'Une volée' }),
    el('p', { html: 'Une <b>volée</b>, c’est le groupe d’hommes que tu envoies tirer <b>en même temps</b> : '
      + 'jusqu’à <b>trois</b>, tous du <b>même bord</b> — <span class="pion ba">bâbord</span> ou '
      + '<span class="pion tri">tribord</span>, jamais mélangés. Les canons d’un bord tirent ensemble ; '
      + 'ceux d’en face regardent la mer.' }),
    el('p', { html: 'Touche des hommes pour les mettre à la manœuvre, puis <b>pousse la volée</b> sur la zone '
      + 'qui s’ouvre sous La Tortue. Le tableau écrit le compte exact <b>avant</b> que tu lâches.' }),
    el('p', { html: 'En face, <b>elle montre la carte qu’elle jouera</b> à la fin de ton tour. Rien n’est caché, '
      + 'rien n’est tiré au sort.' }),
    el('button', { class: 'btn-level-1', text: 'À la manœuvre', attrs: { type: 'button' }, on: { click: () => fond.remove() } }),
  ]));
  document.body.appendChild(fond);
}

function ouvrirAide() {
  const fond = el('div', { class: 'overlay', on: { click: (e) => { if (e.target === fond) fond.remove(); } } });
  const b = el('div', { class: 'modal ecran-cartes aide-boite' });
  b.innerHTML = `
    <h3>Comment on tire</h3>
    <h4>Le bord — avec qui</h4>
    <p>Chaque homme sert d'un côté du navire : <span class="pion ba">bâbord</span> ou
    <span class="pion tri">tribord</span>, comme les feux de position. <b>Une volée ne mêle pas les deux bords</b> :
    les canons d'un bord tirent ensemble, ceux d'en face regardent la mer.</p>
    <h4>Le gabier — ce qu'on empêche</h4>
    <p>La prise annonce sa carte un tour à l'avance. <b>Un gabier dans la volée la coupe</b> : elle
    n'aura pas lieu. C'est tout ce qu'il faut, et il n'y a rien d'autre à réunir — mais il occupe
    une des trois places, et c'est là tout son prix.</p>
    <h4>Les métiers</h4>
    <ul>${Object.values(CONTENU.roles).map((r) => `<li><b>${r.nom}</b> — ${r.aide}</li>`).join('')}</ul>
    <h4>La rencontre</h4>
    <p>Chaque prise annonce sa <b>résistance</b> : la pression qu'il faut lui mettre pour qu'elle amène son
    pavillon. On a <b>quatre bordées</b> pour l'atteindre et <b>trois rechargements</b> pour se refaire une
    main sans tirer. La main se remplit à ras après chacun.</p>
    <p>Sa résistance atteinte, elle se rend <b>entière</b>. Sa coque à zéro avant, elle coule et l'on ne
    repêche que <b>trois dixièmes</b>. Plus une bordée à tirer, elle <b>s'échappe</b> et l'on n'a rien —
    c'est la seule façon de perdre : <b>La Tortue ne coule pas</b>.</p>
    <p>Sa carte à elle ne touche pas notre coque, elle touche notre <b>main</b> : un homme blessé, un
    homme retenu, une carte Feu, un rechargement perdu, de la pression qui retombe.</p>
    <h4>Les gestes</h4>
    <p>Toucher un homme l'ajoute à la volée. <b>Pousser la volée vers le haut</b>, jusqu'à la zone qui
    s'ouvre sous La Tortue : elle part. <b>Tirer la volée vers le bas</b> : ces hommes-là repartent au
    fond du paquet et l'on en reprend autant — c'est un rechargement. <b>Lâcher entre les deux</b> :
    on renonce.</p>
    <p style="margin-top:10px;color:var(--text-muted)">Graine ${graine} · pioche ${P.pioche.length} · défausse ${P.defausse.length} · équipage ${P.equipage.length}</p>`;
  b.appendChild(el('button', { class: 'btn-level-3', text: 'Fermer', attrs: { type: 'button' }, on: { click: () => fond.remove() } }));
  fond.appendChild(b);
  document.body.appendChild(fond);
}

/* -------------------------------------------------------------- tutoriel
   Un projecteur sur ce qu'il faut regarder, une phrase, et rien d'autre.
   IL NE PREND JAMAIS LA MAIN : aucune touche n'est bloquée, aucune action
   n'est forcée. Un tutoriel qui pilote apprend à obéir ; celui-ci nomme ce
   qu'on a sous les yeux et s'efface dès que le joueur agit.

   Chaque étape dit OÙ regarder (`quoi`, un sélecteur) et QUAND elle est finie
   (`fait`, une condition relue à chaque rendu). Une étape dont la condition
   est déjà vraie est sautée : on n'explique pas ce qui est déjà acquis. */
// LE TUTORIEL DORT. Il sera repris en temps voulu : le code, les sept étapes
// et leurs conditions restent en place, seule l'entrée est fermée. Mettre
// `TUTORIEL_OUVERT` à `true` le rallume tel quel.
const TUTORIEL_OUVERT = false;
const CLE_TUTO = 'fdlc-cartes-tuto-fait';
const tuto = { i: -1, fini: !TUTORIEL_OUVERT, halo: null, boite: null };

const ETAPES = [
  {
    quoi: '.main',
    qui: 'Coudray, maître d’équipage',
    dit: 'Voilà ta main. Cinq hommes, refaits à ras après chaque bordée — mais tu n’as que quatre bordées.',
    fait: () => P.selection.length > 0,
  },
  {
    quoi: '.carte:not(.muet)',
    qui: 'Coudray',
    dit: 'Chaque homme sert d’un bord : <b>bâbord</b> en rouge, <b>tribord</b> en vert. '
      + 'Touche-en un : les canons de l’autre bord s’éteignent aussitôt, ils ne tirent pas ensemble.',
    fait: () => P.selection.length > 0,
  },
  {
    quoi: '.tableau',
    qui: 'Etcheverry, canonnier',
    dit: 'Le compte est écrit <b>avant</b> qu’on tire. Pas de dé, pas de surprise : ce chiffre-là est celui qui tombera.',
    fait: () => P.tour > 1,
  },
  {
    quoi: '.sa-carte',
    qui: 'Coudray',
    dit: 'Et elle, elle montre la carte qu’elle jouera <b>à la fin de ton tour</b>. Tu sais ce qui vient.',
    fait: () => P.tour > 1,
  },
  {
    quoi: '.ratelier',
    qui: 'Etcheverry',
    dit: 'Pousse la volée jusqu’à la zone qui s’ouvre sous La Tortue, et lâche. '
      + 'Si tu changes d’avis, redescends avant de lâcher.',
    fait: () => P.tour > 1,
  },
  {
    quoi: '.rb-coups',
    qui: 'Coudray',
    dit: 'Quatre <b>bordées</b> pour l’amener, trois <b>rechargements</b> pour refaire ta main sans tirer. '
      + 'Il n’y a rien d’autre à compter.',
    fait: () => P.tour > 2,
  },
  {
    quoi: '.sa-carte',
    qui: 'Gohier, matelot',
    dit: 'Elle annonce sa carte un tour à l’avance. Un <b>gabier</b> dans ta volée la coupe : '
      + 'elle n’aura pas lieu.',
    fait: () => P.tour > 3,
  },
];

function tutoLancer() {
  if (!TUTORIEL_OUVERT) return;
  try { if (localStorage.getItem(CLE_TUTO)) { tuto.fini = true; return; } } catch { /* mode privé */ }
  if (new URLSearchParams(location.search).has('sansTuto')) { tuto.fini = true; return; }
  if (tuto.i >= 0) return;
  tuto.i = 0;
  tutoRendre();
}

function tutoFinir() {
  tuto.fini = true;
  try { localStorage.setItem(CLE_TUTO, '1'); } catch { /* mode privé */ }
  tutoEffacer();
}
function tutoEffacer() {
  if (tuto.halo) { tuto.halo.remove(); tuto.halo = null; }
  if (tuto.boite) { tuto.boite.remove(); tuto.boite = null; }
}

// Relu après CHAQUE rendu : l'étape avance quand le joueur a fait la chose,
// pas quand il a appuyé sur « suivant ».
function tutoRendre() {
  if (tuto.fini || tuto.i < 0 || ecran !== 'chasse') { tutoEffacer(); return; }
  while (tuto.i < ETAPES.length && ETAPES[tuto.i].fait()) tuto.i += 1;
  if (tuto.i >= ETAPES.length) { tutoFinir(); return; }
  const e = ETAPES[tuto.i];
  const cible = document.querySelector(e.quoi);
  if (!cible) { tutoEffacer(); return; }
  const r = cible.getBoundingClientRect();

  if (!tuto.halo) { tuto.halo = el('div', { class: 'tuto-halo' }); document.body.appendChild(tuto.halo); }
  Object.assign(tuto.halo.style, {
    left: `${r.left - 5}px`, top: `${r.top - 5}px`, width: `${r.width + 10}px`, height: `${r.height + 10}px`,
  });

  if (tuto.boite) tuto.boite.remove();
  tuto.boite = el('div', { class: 'tuto-mot' }, [
    el('span', { class: 't-qui', text: e.qui }),
    el('div', { html: e.dit }),
    el('div', { class: 't-pied' }, [
      el('button', { class: 'passer', text: 'passer le tutoriel', attrs: { type: 'button' }, on: { click: tutoFinir } }),
      el('span', { class: 't-cpt', text: `${tuto.i + 1}/${ETAPES.length}` }),
      el('button', { text: 'compris', attrs: { type: 'button' }, on: { click: () => { tuto.i += 1; tutoRendre(); } } }),
    ]),
  ]);
  document.body.appendChild(tuto.boite);
  // La boîte se pose du côté où il reste de la place, jamais sur le halo.
  const hb = tuto.boite.getBoundingClientRect();
  const dessous = r.bottom + 12 + hb.height < window.innerHeight - 6;
  tuto.boite.style.top = dessous ? `${r.bottom + 12}px` : `${Math.max(6, r.top - hb.height - 12)}px`;
}

/* ---------------------------------------------------------------- rendu */
// La largeur d'une carte est calculée UNE fois pour la main pleine, et ne
// bouge plus : sinon la main change de forme à chaque volée jouée, et deux
// cartes restantes s'étalent sur tout l'écran.
function calibrerCartes() {
  const rat = document.querySelector('.ecran-cartes .ratelier');
  if (!rat) return;
  const n = C.tailleMain(P);
  const gap = 5;
  const large = Math.floor((rat.clientWidth - 14 - gap * (n - 1)) / n);
  const s = document.querySelector('.screen.ecran-cartes');
  s.style.setProperty('--carte-l', `${large}px`);
  s.style.setProperty('--jeu-gap', `${gap}px`);
  // 1 pour 1,45 : la proportion d'une carte à jouer. À 1 pour 2,5 la carte
  // était une lame, et le centre restait vide entre le haut et le pied.
  s.style.setProperty('--carte-h', `${Math.round(large * 1.45)}px`);
}

function rendre() {
  const r = app();
  while (r.firstChild) r.removeChild(r.firstChild);
  const s = ecran === 'carte' ? ecranCarte()
    : ecran === 'partage' ? ecranPartage()
      : ecran === 'epave' ? ecranEpave()
        : ecran === 'rencontre' ? ecranRencontre()
          : ecranChasse();
  r.appendChild(s);
  if (ecran === 'chasse') { calibrerCartes(); peindreCoques(); brancherGeste(s); }
  // La distribution est un ÉVÉNEMENT, pas un état : une fois les cartes
  // arrivées, on oublie qui venait d'arriver. Sans cet oubli, l'animation
  // repartait à chaque rendu — c'est-à-dire à chaque homme touché.
  neuves = [];
  tutoRendre();
}

initFx();
if (CARTE_OUVERTE) rendre(); else retourAuJeu();
fumerEnContinu();
window.addEventListener('resize', () => { if (!tuto.fini) tutoRendre(); });

// L'HORIZON EST POSÉ SUR LES NAVIRES, pas sur une fraction devinée : on le
// place au tiers supérieur des coques, si bien qu'on voit du ciel à travers
// les voiles hautes et de l'eau derrière les coques. Il faut donc que la
// bande de mer ait été mesurée — d'où l'appel APRÈS le premier rendu.
function poserHorizon() {
  const f = document.querySelector('.ecran-cartes .flotte');
  if (!f) return 0.4;
  const r = f.getBoundingClientRect();
  return Math.max(0.2, Math.min(0.6, (r.top + r.height * 0.34) / window.innerHeight));
}
startOcean(document.getElementById('ocean'), { horizon: poserHorizon() });
</script>
